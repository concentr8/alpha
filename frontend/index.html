  <script data-source="home.js">
const agent = document.getElementById('agent');
const toggle = document.getElementById('ai-toggle');
const notice = document.getElementById('notice');
let noticeTimer;
function announce(message) {
  notice.textContent=message;
  notice.hidden=false;
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>{notice.hidden=true;},4200);
}
let agentReturnFocus;
function setAgent(open, focusInput=true) {
  if (open && agent.hidden) agentReturnFocus=document.activeElement;
  if (!open) window.dispatchEvent(new CustomEvent('articul8:stop-voice',{detail:{surface:'agent'}}));
  agent.hidden=!open;
  toggle.setAttribute('aria-expanded',String(open));
  toggle.setAttribute('aria-label',open?'Close Concentr8 Agent':'Open Concentr8 Agent');
  if (open) window.dispatchEvent(new CustomEvent('articul8:agent-open'));
  if (open && focusInput) agent.querySelector('textarea').focus();
  if (!open && agent.contains(document.activeElement)) {
    const target=agentReturnFocus && agentReturnFocus.isConnected && agentReturnFocus.getClientRects().length ? agentReturnFocus : toggle;
    target.focus();
  }
}

(() => {
  const store=window.Articul8;
  const app=document.querySelector('.app');
  const sidebar=document.getElementById('sidebar');
  const checkIn=document.querySelector('.check-in');
  const mainForm=document.getElementById('main-composer');
  const agentForm=mainForm.cloneNode(true);
  agentForm.id='agent-composer';
  agentForm.querySelector('textarea').setAttribute('aria-label','Message Concentr8 Agent');
  agentForm.querySelector('[data-voice]').dataset.voice='agent';
  document.getElementById('agent-composer-mount').replaceWith(agentForm);
  const forms=[mainForm,agentForm];
  const inputs=forms.map(form=>form.querySelector('textarea'));
  const conversations=[document.getElementById('home-conversation'),document.getElementById('agent-conversation')];
  const taskList=document.getElementById('home-tasks');
  const contexts=forms.map(form=>{const context=document.createElement('div');context.className='chat-context';context.hidden=true;if(form===mainForm)form.before(context);else agent.querySelector('header').after(context);return context;});
  const addTaskForm=document.getElementById('add-task-form');
  const addTaskToggle=document.getElementById('add-task-toggle');
  const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let storageNoticeShown=false;
  const voicePane=document.createElement('div');
  voicePane.className='voice-pane';voicePane.hidden=true;
  voicePane.innerHTML='<button class="voice-finish" type="button" aria-label="Finish and send voice message"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button><p class="voice-message" role="status" aria-live="polite"></p><p class="voice-hint"></p>';
  agent.querySelector('header').after(voicePane);
  const voiceFinish=voicePane.querySelector('.voice-finish');
  const voiceCapture=createVoiceCapture({
    onState:renderVoice,
    onComplete:({text,base,submit,surface})=>{
      const message=[base,text].filter(Boolean).join(' ');
      if(submit){store.send(message);window.Concentr8?.ask();}else store.setDraft(message);
      (surface==='agent'?agentForm:mainForm).querySelector('textarea').focus();
    },
    onError:(message,draft)=>{
      if(draft)store.setDraft(draft);
      announce(message);
      if(!agent.hidden)agentForm.querySelector('textarea').focus();
    }
  });
  function renderVoice(state) {
    const wasActive=agent.classList.contains('voice-active');
    const inAgent=state.active&&state.surface==='agent';
    const status={connecting:'Connecting…',listening:'Listening…',finishing:'Finishing…',paused:'Listening stopped'}[state.phase]||'';
    agent.classList.toggle('voice-active',inAgent);agent.dataset.voicePhase=state.phase;
    voicePane.hidden=!inAgent;
    voicePane.querySelector('.voice-message').textContent=inAgent?status:'';
    voicePane.querySelector('.voice-hint').textContent=state.phase==='finishing'?'':'Shift to send';
    voiceFinish.disabled=state.phase==='finishing';
    voiceFinish.setAttribute('aria-label',state.submit?'Finish and send voice message':'Finish voice input');
    inputs.forEach(input=>{input.readOnly=state.active;});
    document.querySelectorAll('[data-voice]').forEach(button=>{
      const on=state.active&&button.dataset.voice===state.surface;
      button.setAttribute('aria-pressed',String(on));
      button.setAttribute('aria-label',on?(state.submit?'Finish and send voice message':'Finish voice input'):'Start voice input');
      button.title=on?'Finish voice input':'Voice input';
      button.disabled=on&&state.phase==='finishing';
      const label=button.parentElement.querySelector('.voice-status');
      label.hidden=!on;label.textContent=on?status:'';
    });
    renderDraft();
    if(inAgent&&!wasActive)voiceFinish.focus();
  }

  function sizeInput(input) {
    if (!input.getClientRects().length) return;
    input.style.height='32px';
    input.style.height=Math.min(116,Math.max(32,input.scrollHeight))+'px';
  }
  function renderDraft() {
    inputs.forEach(input=>{
      if(input.value!==store.state.draft) input.value=store.state.draft;
      sizeInput(input);
      input.form.querySelector('[type="submit"]').disabled=voiceCapture.active||!input.value.trim();
    });
  }
  function renderSidebar() {
    const collapsed=store.state.collapsed;
    app.classList.toggle('sidebar-collapsed',collapsed);
    sidebar.inert=collapsed;
    document.getElementById('open-sidebar').hidden=!collapsed;
    document.getElementById('collapse-sidebar').setAttribute('aria-expanded',String(!collapsed));
    inputs.forEach(sizeInput);
  }
  function renderMessages() {
    const html=store.state.messages.map(message=>{/* AI-GENERATED: answers of Concentr8 sit on the left, the student's own messages stay on the right. */if(message.role==='assistant')return `<article class="chat-message" style="align-items:flex-start" aria-label="Concentr8"><p>${escapeHtml(message.text)}</p></article>`;const calendar=CalendarUI.messageMarkup(message);return `<article class="chat-message"><p>${escapeHtml(message.text)}</p><div class="message-actions"><button type="button" class="message-action" data-message-task="${escapeHtml(message.id)}" ${message.taskId?'disabled':''}>${message.taskId?'Added to to-do':'+ To-do'}</button>${message.proposal?'':calendar}<button type="button" class="message-action" data-message-tools="${escapeHtml(message.id)}">Tools</button></div>${message.proposal?calendar:''}</article>`;}).join('');
    conversations.forEach(log=>{log.innerHTML=html;log.scrollTop=log.scrollHeight;});
    checkIn.classList.toggle('has-messages',store.state.messages.length>0);
  }
  function renderTasks() {
    const focusedId=document.activeElement?.dataset.taskCheck;
    taskList.innerHTML=store.state.tasks.map(task=>`<li class="task"><input type="checkbox" data-task-check="${escapeHtml(task.id)}" aria-label="Complete ${escapeHtml(task.title)}" ${task.done?'checked':''}><button class="task-title" type="button" data-discuss-task="${escapeHtml(task.id)}" aria-label="Discuss ${escapeHtml(task.title)}">${escapeHtml(task.title)}</button></li>`).join('');
    if(focusedId)Array.from(taskList.querySelectorAll('input')).find(input=>input.dataset.taskCheck===focusedId)?.focus();
  }
  /* AI-GENERATED: greeting, "Up next" and the on-demand to-do list of the clean start screen (docs/plans/home-chat-tools.md). */
  const greetingTitle=document.getElementById('check-in-title');
  const upNextList=document.getElementById('up-next-list');
  const allTodos=document.getElementById('all-todos');
  function renderGreeting() {
    const hour=new Date().getHours();
    const word=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
    const name=store.state.profile.name.trim();
    greetingTitle.textContent=name?word+', '+name:word;
  }
  // A task is due at its earliest "deadline" calendar event, the same rule the Toolbox pages use.
  function deadlineOf(task) {
    return store.state.calendarEvents.filter(e=>e.taskId===task.id&&e.kind==='deadline').map(e=>e.start).sort()[0]||'';
  }
  function dueLabel(start) {
    if(!start)return 'No due date';
    const todayLA=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const days=Math.round((Date.parse(start.slice(0,10)+'T12:00Z')-Date.parse(todayLA+'T12:00Z'))/86400000);
    if(days<0)return 'Overdue';
    if(days===0)return 'Due today';
    if(days===1)return 'Due tomorrow';
    const date=new Date(start.slice(0,10)+'T12:00Z');
    return 'Due '+(days<=6?date.toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'}):date.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}));
  }
  function renderUpNext() {
    const open=store.state.tasks.filter(task=>!task.done);
    // Tasks without a due date go last: '9' sorts after any date string.
    const top=open.map(task=>({task,due:deadlineOf(task)})).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,3);
    upNextList.innerHTML=top.map(({task,due})=>`<li><button class="up-next-card" type="button" data-discuss-task="${escapeHtml(task.id)}"><strong>${escapeHtml(task.title)}</strong><span>${dueLabel(due)}</span></button></li>`).join('')
      +`<li><button class="up-next-card" type="button" data-open-todos><strong>All to-dos</strong><span>${open.length} open</span></button></li>`;
  }
  upNextList.addEventListener('click',event=>{
    if(event.target.closest('[data-open-todos]')){setAllTodos(true);return;}
    const button=event.target.closest('[data-discuss-task]');
    if(!button)return;
    store.selectTask(button.dataset.discussTask);
    store.setAgentEvent(null);
    inputs[0].focus();
  });
  function setAllTodos(open) {
    allTodos.hidden=!open;
    app.classList.toggle('todo-open',open);
    if(open)allTodos.querySelector('[data-close-todos]').focus();
    else upNextList.querySelector('[data-open-todos]')?.focus();
  }
  allTodos.querySelector('[data-close-todos]').addEventListener('click',()=>setAllTodos(false));
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!allTodos.hidden)setAllTodos(false);});
  function renderContext() {
    const event=store.state.calendarEvents.find(e=>e.id===store.state.agentEventId);
    contexts.forEach(context=>{context.hidden=!event;context.innerHTML=event?`<button type="button" data-open-context><span>${escapeHtml(event.title)}</span><span>${escapeHtml(CalendarUI.timeLabel(event))}</span></button><button class="icon-button" type="button" data-clear-context aria-label="Clear selected event">×</button>`:'';});
  }
  contexts.forEach(context=>context.addEventListener('click',event=>{if(event.target.closest('[data-clear-context]'))store.setAgentEvent(null);else if(event.target.closest('[data-open-context]'))CalendarUI.details(store.state.agentEventId);}));
  function renderAll() { renderDraft();renderGreeting();renderUpNext();renderSidebar();renderMessages();renderTasks();renderContext(); }
  window.addEventListener('articul8:change',event=>{
    const {reason,persisted}=event.detail;
    if(!persisted&&!storageNoticeShown){announce('Changes are saved for this session only.');storageNoticeShown=true;}
    if(reason==='draft')renderDraft();
    else if(reason==='sidebar')renderSidebar();
    else if(reason==='tasks'){renderTasks();renderUpNext();renderMessages();}
    else renderAll();
  });
  window.addEventListener('articul8:agent-open',()=>{renderDraft();const log=conversations[1];log.scrollTop=log.scrollHeight;});
  document.getElementById('collapse-sidebar').addEventListener('click',()=>{store.setCollapsed(true);document.getElementById('open-sidebar').focus();});
  document.getElementById('open-sidebar').addEventListener('click',()=>{store.setCollapsed(false);document.getElementById('collapse-sidebar').focus();});
  toggle.addEventListener('click',()=>{setAgent(agent.hidden);renderDraft();});
  document.getElementById('close-agent').addEventListener('click',()=>setAgent(false));
  forms.forEach(form=>{
    const input=form.querySelector('textarea');
    input.addEventListener('input',()=>{
      if(voiceCapture.active)voiceCapture.cancel();
      store.setDraft(input.value);
    });
    input.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit();}
    });
    form.addEventListener('submit',event=>{
      event.preventDefault();
      if(voiceCapture.active){voiceCapture.finish({submit:true});return;}
      const text=input.value.trim();
      if(!text){input.focus();return;}
      voiceCapture.cancel();
      store.send(text);
      window.Concentr8?.ask();
      input.focus();
    });
  });
  conversations.forEach(log=>log.addEventListener('click',event=>{
    const toolsButton=event.target.closest('[data-message-tools]');
    if(toolsButton){const message=store.state.messages.find(m=>m.id===toolsButton.dataset.messageTools);if(message){if(!message.taskId)store.addTask(message.text,message.id);else store.selectTask(message.taskId);store.change(s=>{s.tools.customSelection=false;},'tools');Product.go('Toolbox');}return;}
    const calendarButton=event.target.closest('[data-cal-message]');
    if(calendarButton){CalendarUI.messageAction(calendarButton);return;}
    const button=event.target.closest('[data-message-task]');
    if(!button)return;
    const message=store.state.messages.find(m=>m.id===button.dataset.messageTask);
    if(message)store.addTask(message.text,message.id);
  }));
  taskList.addEventListener('change',event=>{
    if(event.target.matches('[data-task-check]'))store.completeTask(event.target.dataset.taskCheck,event.target.checked);
  });
  taskList.addEventListener('click',event=>{
    const button=event.target.closest('[data-discuss-task]');
    if(!button)return;
    const task=store.state.tasks.find(t=>t.id===button.dataset.discussTask);
    store.selectTask(task.id);
    store.setAgentEvent(null);
    // Keep the chosen task as context without inserting text into either composer.
    setAgent(true);
  });
  function setAddTask(open) {
    addTaskForm.hidden=!open;
    addTaskToggle.setAttribute('aria-expanded',String(open));
    if(open)addTaskForm.querySelector('input').focus();
  }
  addTaskToggle.addEventListener('click',()=>setAddTask(addTaskForm.hidden));
  addTaskForm.addEventListener('submit',event=>{
    event.preventDefault();
    const input=addTaskForm.querySelector('input');
    if(!input.value.trim())return;
    store.addTask(input.value);input.value='';setAddTask(false);addTaskToggle.focus();
  });
  addTaskForm.addEventListener('keydown',event=>{if(event.key==='Escape'){setAddTask(false);addTaskToggle.focus();}});

  // Bare Shift is a two-tap voice action; Shift combinations keep their usual behavior.
  let shiftOnly=false;
  function shiftVoice(){
    const dialog=document.querySelector('dialog[open]');
    if(dialog){
      if(!dialog.dataset.agentEventId)return;
      store.setAgentEvent(dialog.dataset.agentEventId);dialog.close();
    }
    setAgent(true,false);
    if(voiceCapture.active)voiceCapture.finish({submit:true,surface:'agent'});
    else {notice.hidden=true;voiceCapture.start({surface:'agent',submit:true,base:store.state.draft});}
  }
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&!document.querySelector('dialog[open]')){voiceCapture.cancel();setAgent(false);notice.hidden=true;}
    if(event.key==='Shift'&&!event.repeat&&!event.ctrlKey&&!event.altKey&&!event.metaKey&&!event.isComposing)shiftOnly=true;
    else if(event.key!=='Shift')shiftOnly=false;
  });
  document.addEventListener('keyup',event=>{
    if(event.key!=='Shift')return;
    if(shiftOnly&&!event.ctrlKey&&!event.altKey&&!event.metaKey&&!event.isComposing)shiftVoice();
    shiftOnly=false;
  });
  document.addEventListener('pointerdown',()=>{shiftOnly=false;});
  document.addEventListener('wheel',()=>{shiftOnly=false;},{passive:true});
  window.addEventListener('blur',()=>{shiftOnly=false;});
  voiceFinish.addEventListener('click',()=>voiceCapture.finish());
  document.querySelectorAll('[data-voice]').forEach(button=>button.addEventListener('click',()=>{
    if(voiceCapture.active){voiceCapture.finish();return;}
    notice.hidden=true;voiceCapture.start({surface:button.dataset.voice,submit:false,base:store.state.draft});
  }));
  window.addEventListener('articul8:stop-voice',event=>{if(!event.detail?.surface||event.detail.surface===voiceCapture.surface)voiceCapture.cancel();});
  window.addEventListener('articul8:navigate',()=>voiceCapture.cancel());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)voiceCapture.cancel();});
  window.addEventListener('pagehide',()=>voiceCapture.cancel());
  window.addEventListener('resize',()=>inputs.forEach(sizeInput));
  renderAll();
})();

</script>
<script data-source="tool-pages.js">
(() => {
  const P=Product,S=Articul8,E=P.esc;
  const icons={pause:'M8 5v14M16 5v14',previous:'M5 5v14M19 5 8 12l11 7V5Z',next:'M19 5v14M5 5l11 7L5 19V5Z',volume:'M3 9h4l5-4v14l-5-4H3V9Zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14',muted:'M3 9h4l5-4v14l-5-4H3V9Zm13 0 6 6m0-6-6 6',search:'M15 15l6 6M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z',trash:'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7',save:'m6 3 12 0v18l-6-4-6 4V3Z',screen:'M3 4h18v13H3V4Zm5 17h8m-4-4v4M8 10l4-4 4 4m-4-4v8',chat:'M3 4h18v13H8l-5 4V4Zm4 5h10M7 13h7',settings:'M19.96 11.22L21.95 12.98L21.57 14.90L19.06 15.77L18.18 17.08L18.34 19.73L16.71 20.82L14.32 19.66L12.78 19.96L11.02 21.95L9.10 21.57L8.23 19.06L6.92 18.18L4.27 18.34L3.18 16.71L4.34 14.32L4.04 12.78L2.05 11.02L2.43 9.10L4.94 8.23L5.82 6.92L5.66 4.27L7.29 3.18L9.68 4.34L11.22 4.04L12.98 2.05L14.90 2.43L15.77 4.94L17.08 5.82L19.73 5.66L20.82 7.29L19.66 9.68Z M15.2 12a3.2 3.2 0 1 0-6.4 0a3.2 3.2 0 1 0 6.4 0',camera:'M3 6h12v12H3V6Zm12 4 6-3v10l-6-3'};
  const icon=(name,size=24)=>P.icon(icons[name]||P.paths[name],size);
  const button=(attr,label,name,extra='')=>`<button class="icon-button" type="button" ${attr} aria-label="${E(label)}" title="${E(label)}" ${extra}>${icon(name)}</button>`;
  function heading(title,actions='',backPage='Toolbox',backPath='') {return `<div class="detail-heading"><button class="text-back" type="button" data-detail-back="${E(backPage)}" data-back-path="${E(backPath)}">${icon('back')}Back</button><h1>${E(title)}</h1>${actions?`<div class="detail-actions">${actions}</div>`:''}</div>`;}
  const redraw=()=>window.dispatchEvent(new CustomEvent('articul8:rerender'));
  const searchIcon=()=>icon('search');
  const active=()=>location.hash.startsWith('#toolbox');
  const format=seconds=>{seconds=Math.max(0,Math.ceil(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');};

  function checklist(){return heading('Checklist')+`<section class="checklist-editor"><div class="checklist-rows">${S.state.tasks.map(t=>`<div class="check-row ${t.done?'done':''}"><input type="checkbox" data-list-check="${E(t.id)}" aria-label="Complete ${E(t.title)}" ${t.done?'checked':''}><input type="text" data-list-title="${E(t.id)}" aria-label="Edit ${E(t.title)}" value="${E(t.title)}" maxlength="2000"><span class="check-due">${P.due(t.id)?E(P.dateLabel(P.due(t.id).start)):''}</span>${button(`data-list-delete="${E(t.id)}"`,'Delete '+t.title,'trash')}</div>`).join('')||'<p class="detail-empty">No tasks yet.</p>'}</div><form class="check-add" id="check-add"><input aria-label="New checklist item" placeholder="Add a to-do" maxlength="2000" required><button class="wire-button" type="submit">Add</button></form></section>`;}
  function removeTask(id){S.change(s=>{const eventIds=s.calendarEvents.filter(e=>e.taskId===id).map(e=>e.id);s.tasks=s.tasks.filter(t=>t.id!==id);s.calendarEvents=s.calendarEvents.filter(e=>e.taskId!==id);s.messages.forEach(m=>{if(m.taskId===id)m.taskId=null;if(eventIds.includes(m.eventId))m.eventId=null;if(eventIds.includes(m.contextId))m.contextId=null;});if(s.activeTaskId===id)s.activeTaskId=null;if(eventIds.includes(s.agentEventId))s.agentEventId=null;},'tasks');}

  const appNames=['Steam','Twitch','Discord','Epic Games','YouTube','TikTok','Instagram','Reddit','X','Facebook','Slack','Microsoft Teams','WhatsApp','Netflix'];
  const presets=[{name:'Games',apps:['Steam','Twitch','Discord']},{name:'Social media',apps:['Instagram','TikTok','Reddit','X']},{name:'Entertainment',apps:['YouTube','Netflix','Twitch']},{name:'Quiet work',apps:['Slack','Microsoft Teams','WhatsApp']}];
  let appQuery='';
  const addApps=names=>S.change(s=>{for(const name of names){const value=name.trim().slice(0,120);if(value&&!s.tools.blockedApps.some(a=>a.toLowerCase()===value.toLowerCase()))s.tools.blockedApps.push(value);}},'tools');
  function candidates(){const items=appQuery.trim()?appNames.filter(n=>n.toLowerCase().includes(appQuery.toLowerCase())&&!S.state.tools.blockedApps.some(a=>a.toLowerCase()===n.toLowerCase())):[];return items.map(n=>`<button class="wire-button" type="button" data-add-block="${E(n)}">${E(n)} ${icon('plus',17)}</button>`).join('');}
  /* AI-GENERATED: the hints panel (concentr8-blocker.js) has no wireframe from Jack. */
  function block(){return heading('Block App')+(window.Concentr8Blocker?window.Concentr8Blocker.panel():'')+`<h2 class="block-prompt">Type in the apps that you would like to block</h2><form class="detail-search" id="block-search">${searchIcon()}<input aria-label="Search apps to block" placeholder="Search or add an app" maxlength="120" value="${E(appQuery)}" autocomplete="off" required><button class="wire-button" type="submit">Add</button></form><div class="app-candidates">${candidates()}</div><div class="block-layout"><section class="detail-section block-list-section"><h2>Block list</h2><div class="blocked-list">${S.state.tools.blockedApps.map((n,i)=>`<span class="blocked-app">${E(n)}${button(`data-block-remove="${i}"`,'Remove '+n,'close')}</span>`).join('')||'<span class="detail-note">No apps added.</span>'}</div></section><section class="detail-section block-preset-section"><h2>Presets</h2><div class="preset-grid">${presets.map((p,i)=>{const all=p.apps.every(n=>S.state.tools.blockedApps.some(a=>a.toLowerCase()===n.toLowerCase()));return `<article class="block-preset"><h3>${p.name}</h3><p>${p.apps.join(' · ')}</p><button type="button" class="wire-button" data-block-preset="${i}" ${all?'disabled':''}>${all?'Added':'Add preset'}</button></article>`;}).join('')}</div></section></div>`;}

  const mixes=[{id:'nature',name:'Nature',art:'M10 80Q45 40 80 80T150 80M10 100Q45 60 80 100T150 100M10 120Q45 80 80 120T150 120'},{id:'piano',name:'Ambient Piano',art:'M20 30h120v100H20V30Zm20 0v100m20-100v100m20-100v100m20-100v100m20-100v100M35 30v55m20-55v55m40-55v55m20-55v55'},{id:'electronic',name:'Soft Electronic',art:'M20 80h20l10-35 20 70 20-70 20 70 10-35h20'},{id:'acoustic',name:'Acoustic',art:'M20 120Q80-20 140 120M35 120Q80 10 125 120M50 120Q80 40 110 120M65 120Q80 70 95 120'}];
  const mixTracks=[[{title:'Rain and Pads',url:'music/nature-1.mp3'}],[{title:'Felt Piano',url:'music/ambient-piano-1.mp3'}],[{title:'Soft Pulse',url:'music/soft-electronic-1.mp3'}],[{title:'Warm Guitar',url:'music/acoustic-1.mp3'}]];
  let mixIndex=0,trackIndex=0,trackLists=mixTracks.map(list=>list.map(t=>({title:t.title,artist:'Concentr8',url:t.url}))),musicMessage='',volumeOpen=false,samplePlaying=false;
  const audio=new Audio();audio.preload='metadata';audio.volume=.45;
  const track=()=>trackLists[mixIndex][trackIndex];
  const musicPlaying=()=>track()?.url?!audio.paused:samplePlaying;
  const pauseMusic=()=>{samplePlaying=false;audio.pause();paintMusic();};
  function paintMusic(){const root=document.querySelector('.music-player');if(!root)return;const t=track();root.querySelector('[data-track-title]').textContent=t.title;root.querySelector('[data-track-artist]').textContent=t.artist||'Local audio';const play=root.querySelector('[data-music-play]');play.disabled=false;play.innerHTML=icon(musicPlaying()?'pause':'play');play.setAttribute('aria-label',musicPlaying()?'Pause music':'Play music');root.querySelectorAll('[data-music-skip]').forEach(b=>b.disabled=trackLists[mixIndex].length<2);root.querySelector('[data-volume-toggle]').innerHTML=icon(audio.muted?'muted':'volume');const status=document.querySelector('.music-status');if(status){status.textContent=musicMessage;status.hidden=!musicMessage;}}
  function loadTrack(play=false){samplePlaying=false;audio.pause();musicMessage='';const t=track();if(t?.url){audio.src=t.url;if(play)audio.play().catch(()=>{musicMessage='Audio could not play.';paintMusic();});}else{audio.removeAttribute('src');audio.load();samplePlaying=play;}paintMusic();}
  function music(){return heading('Music')+`<div class="music-gallery">${mixes.map((m,i)=>`<article class="ambient-card"><button class="ambient-select" type="button" data-mix="${i}" aria-pressed="${i===mixIndex}"><div class="ambient-art"><svg viewBox="0 0 160 160" aria-hidden="true"><path d="${m.art}"/></svg></div><span>${m.name}</span></button><div class="ambient-import"><span>${E(trackLists[i][0].title)}</span><label class="audio-import-label">Add audio<input type="file" accept="audio/*" multiple data-audio-import="${i}" aria-label="Add audio to ${m.name}"></label></div></article>`).join('')}</div><div class="player-bar music-player"><div class="player-track"><strong data-track-title>${E(track().title)}</strong><span data-track-artist>${E(track().artist||'Local audio')}</span></div><div class="player-controls">${button('data-music-skip="-1"','Previous track','previous',trackLists[mixIndex].length<2?'disabled':'')}<button type="button" class="icon-button player-primary" data-music-play aria-label="${musicPlaying()?'Pause':'Play'} music">${icon(musicPlaying()?'pause':'play')}</button>${button('data-music-skip="1"','Next track','next',trackLists[mixIndex].length<2?'disabled':'')}</div><div class="player-volume">${button('data-volume-toggle','Volume',audio.muted?'muted':'volume',`aria-expanded="${volumeOpen}"`)}<input type="range" min="0" max="100" value="${audio.volume*100}" aria-label="Music volume" data-music-volume ${volumeOpen?'':'hidden'}></div></div><p class="music-status" ${musicMessage?'':'hidden'}>${E(musicMessage)}</p>`;}
  audio.addEventListener('play',paintMusic);audio.addEventListener('pause',paintMusic);audio.addEventListener('error',()=>{if(track()?.url){musicMessage='This audio format could not be played.';paintMusic();}});audio.addEventListener('ended',()=>{if(trackLists[mixIndex].length>1){trackIndex=(trackIndex+1)%trackLists[mixIndex].length;loadTrack(true);}else paintMusic();});

  let timerSeconds=Number.isFinite(Number(S.state.tools.timerSeconds))?Math.max(0,Math.min(86399,Math.floor(Number(S.state.tools.timerSeconds)))):1500;
  function timer(){return heading('Timer')+`<section class="timer-picker-page"><div class="time-wheels">${[['Hours',24,Math.floor(timerSeconds/3600),'hr'],['Minutes',60,Math.floor(timerSeconds%3600/60),'min'],['Seconds',60,timerSeconds%60,'sec']].map(([name,max,value,label])=>`<div class="wheel-column"><div class="time-wheel" data-time-wheel="${name.toLowerCase()}" role="listbox" aria-label="${name}" tabindex="0">${Array.from({length:max},(_,i)=>`<button type="button" role="option" tabindex="-1" data-wheel-value="${i}" aria-selected="${i===value}">${String(i).padStart(2,'0')}</button>`).join('')}</div><span>${label}</span></div>`).join('')}</div><div class="timer-total" data-timer-total>${format(timerSeconds)}</div><button type="button" class="wire-button solid" data-timer-start ${!timerSeconds?'disabled':''}>Start</button></section>`;}
  function mountWheels(){const wheels=[...document.querySelectorAll('[data-time-wheel]')];if(!wheels.length)return;const vals=[Math.floor(timerSeconds/3600),Math.floor(timerSeconds%3600/60),timerSeconds%60];wheels.forEach((wheel,i)=>{wheel.scrollTop=vals[i]*44;let debounce;const update=()=>{const value=Math.max(0,Math.min(wheel.children.length-1,Math.round(wheel.scrollTop/44)));vals[i]=value;wheel.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected',String(j===value)));timerSeconds=vals[0]*3600+vals[1]*60+vals[2];const total=document.querySelector('[data-timer-total]'),start=document.querySelector('[data-timer-start]');if(total)total.textContent=format(timerSeconds);if(start)start.disabled=!timerSeconds;S.change(s=>s.tools.timerSeconds=timerSeconds,'tool-setting');};wheel.addEventListener('scroll',()=>{clearTimeout(debounce);debounce=setTimeout(update,90);},{passive:true});wheel.addEventListener('click',e=>{const option=e.target.closest('[data-wheel-value]');if(option){wheel.scrollTop=Number(option.dataset.wheelValue)*44;update();}});wheel.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();const current=Math.round(wheel.scrollTop/44),next=e.key==='Home'?0:e.key==='End'?wheel.children.length-1:current+(e.key==='ArrowDown'?1:-1);wheel.scrollTop=Math.max(0,Math.min(wheel.children.length-1,next))*44;update();});});}
  function timerSession(a){return heading('Timer',`<button class="wire-button" type="button" data-focus-end>End session</button>`,'Toolbox','timer')+`<div class="solo-timer"><div class="timer-dial solo-timer-dial"><svg viewBox="0 0 300 300" aria-hidden="true"><circle class="timer-track" cx="150" cy="150" r="138"/><circle class="timer-progress" data-clockwise-ring cx="150" cy="150" r="138"/></svg><div class="timer-value" data-timer-value>00:00</div></div><div class="timer-controls"><button class="round-control" type="button" data-focus-pause aria-label="${a.status==='running'?'Pause timer':'Resume timer'}">${icon(a.status==='running'?'pause':'play',32)}</button></div></div>`;}
  let rest=null;
  function startBreak(){rest={duration:900,elapsed:0,startedAt:Date.now(),running:true};P.go('Break');}
  function breakPage(){return heading('Break','','Focus')+`<div class="solo-timer"><div class="large-countdown" data-break-time>${format(rest?Math.max(0,rest.duration-rest.elapsed-(rest.running?(Date.now()-rest.startedAt)/1000:0)):900)}</div><div class="timer-controls"><button class="round-control" type="button" data-break-toggle aria-label="${rest?.running?'Pause break':'Start break'}">${icon(rest?.running?'pause':'play',32)}</button><button class="wire-button" type="button" data-break-end>Finish break</button></div></div>`;}
  function render(id){if(id==='body')return BodyRooms.directory();if(id==='music')return music();if(id==='meditation')return Wellness.render();if(id==='meditation-saved')return Wellness.saved();if(id==='block')return block();if(id==='checklist')return checklist();if(id==='timer')return timer();return null;}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-detail-back'))P.go(b.dataset.detailBack,b.dataset.backPath||'');
    if(b.hasAttribute('data-list-delete'))removeTask(b.dataset.listDelete);
    if(b.hasAttribute('data-add-block')){appQuery='';addApps([b.dataset.addBlock]);}
    if(b.hasAttribute('data-block-preset'))addApps(presets[Number(b.dataset.blockPreset)].apps);
    if(b.hasAttribute('data-mix')){if(Number(b.dataset.mix)!==mixIndex){mixIndex=Number(b.dataset.mix);trackIndex=0;loadTrack(false);}redraw();}
    if(b.hasAttribute('data-music-play')){if(!track().url){samplePlaying=!samplePlaying;paintMusic();}else if(!audio.src)loadTrack(true);else if(audio.paused)audio.play().catch(()=>{musicMessage='Audio could not play.';paintMusic();});else audio.pause();}
    if(b.hasAttribute('data-music-skip')){const list=trackLists[mixIndex],wasPlaying=musicPlaying();if(list.length){trackIndex=(trackIndex+Number(b.dataset.musicSkip)+list.length)%list.length;loadTrack(wasPlaying);}}
    if(b.hasAttribute('data-volume-toggle')){volumeOpen=!volumeOpen;const input=document.querySelector('[data-music-volume]');input.hidden=!volumeOpen;b.setAttribute('aria-expanded',String(volumeOpen));}
    if(b.hasAttribute('data-timer-start')){const wheels=[...document.querySelectorAll('[data-time-wheel]')];if(wheels.length===3)timerSeconds=wheels.reduce((n,w,i)=>n+Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/44)))*[3600,60,1][i],0);if(timerSeconds>0){pauseMusic();Wellness.stop();FocusUI.start({taskId:P.currentTask()?.id,minutes:timerSeconds/60,selected:['timer'],origin:'Toolbox',timerOnly:true});}}
    if(b.hasAttribute('data-break-toggle')){if(!rest)rest={duration:900,elapsed:0,startedAt:Date.now(),running:true};else if(rest.running){rest.elapsed+=(Date.now()-rest.startedAt)/1000;rest.running=false;}else{if(rest.elapsed>=rest.duration)rest.elapsed=0;rest.startedAt=Date.now();rest.running=true;}redraw();}
    if(b.hasAttribute('data-break-end')){rest=null;P.go('Focus');}
  });
  document.addEventListener('input',e=>{const t=e.target;if(t.matches('#block-search input')){appQuery=t.value;document.querySelector('.app-candidates').innerHTML=candidates();}if(t.matches('[data-music-volume]')){audio.volume=Number(t.value)/100;audio.muted=audio.volume===0;paintMusic();}});
  document.addEventListener('change',e=>{const t=e.target;
    if(t.matches('[data-list-check]'))S.completeTask(t.dataset.listCheck,t.checked);
    if(t.matches('[data-list-title]')){const task=S.state.tasks.find(x=>x.id===t.dataset.listTitle);if(task){if(t.value.trim()){S.upsertTask({...task,title:t.value},'checklist-edit');t.value=task.title;t.setAttribute('aria-label','Edit '+task.title);const row=t.closest('.check-row');row.querySelector('[data-list-check]').setAttribute('aria-label','Complete '+task.title);row.querySelector('[data-list-delete]').setAttribute('aria-label','Delete '+task.title);}else t.value=task.title;}}
    if(t.matches('[data-audio-import]')){const i=Number(t.dataset.audioImport),files=[...t.files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(f.name));if(files.length){if(trackLists[i].every(t=>!t.url))trackLists[i]=[];for(const f of files)trackLists[i].push({title:f.name.replace(/\.[^.]+$/,''),artist:'Local audio',url:URL.createObjectURL(f)});mixIndex=i;trackIndex=0;loadTrack(false);redraw();}}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-list-title]')){e.preventDefault();e.target.blur();}});
  document.addEventListener('submit',e=>{const f=e.target;if(f.id==='check-add'){e.preventDefault();const input=f.querySelector('input');if(input.value.trim()){S.addTask(input.value);document.querySelector('#check-add input')?.focus();}}if(f.id==='block-search'){e.preventDefault();const value=f.querySelector('input').value;appQuery='';addApps([value]);}});
  setInterval(()=>{const el=document.querySelector('[data-break-time]');if(!rest||!el)return;const remaining=rest.duration-rest.elapsed-(rest.running?(Date.now()-rest.startedAt)/1000:0);el.textContent=format(Math.max(0,remaining));if(remaining<=0&&rest.running){rest.elapsed=rest.duration;rest.running=false;redraw();announce('Break complete.');}},250);
  window.addEventListener('articul8:navigate',()=>{appQuery='';if(!location.hash.includes('meditation'))window.Wellness?.stop();if(!location.hash.startsWith('#room'))window.BodyRooms?.leave();});
  window.addEventListener('pagehide',()=>{audio.pause();trackLists.flat().filter(t=>t.url).forEach(t=>URL.revokeObjectURL(t.url));});
  window.ToolPages={render,heading,icon,button,redraw,format,mountWheels,timerSession,startBreak,breakPage,pauseMusic};
})();

<script data-source="meditation.js">
(() => {
  const P=Product,S=Articul8,T=ToolPages,E=P.esc;
  const themes=[
    {title:'A little more space',anchor:'Notice the space around each breath. There is no need to fill it.',notice:'When a thought arrives, quietly name it thinking. Then let the next breath be a fresh beginning.'},
    {title:'Coming back to the body',anchor:'Feel the contact between your body and the chair or floor. Let that contact support you.',notice:'Travel gently from your feet to your shoulders. Notice sensation without needing to change it.'},
    {title:'One breath at a time',anchor:'Follow one comfortable breath from its beginning to its end.',notice:'If counting helps, count one on an exhale and two on the next. Begin again whenever you lose your place.'},
    {title:'A softer beginning',anchor:'Allow your jaw and your hands to soften, just a little.',notice:'Notice any effort you are holding. You can make room for it without needing to solve anything now.'},
    {title:'Listening quietly',anchor:'Notice a nearby sound, and then a sound further away. Let them come and go.',notice:'Rather than following a sound, notice the quiet between sounds. Your attention can rest there.'},
    {title:'Letting thoughts pass',anchor:'Picture thoughts as leaves moving slowly along water. You do not need to collect them.',notice:'Bring a gentle label to what is here: planning, remembering, or feeling. Then return to the contact of your feet.'},
    {title:'A moment of kindness',anchor:'Notice how you feel, without asking yourself to feel differently.',notice:'Offer yourself a simple phrase: I can take this one moment at a time. You do not need to believe it perfectly.'}
  ];
  const places=['the feeling of air at your nose','the rise and fall of your chest','the movement of your abdomen','the weight of your hands'];
  function daily(date=P.today()) {
    const day=Math.floor(Date.parse(date+'T12:00Z')/86400000),theme=themes[((day%themes.length)+themes.length)%themes.length],anchor=places[Math.floor(day/7)%places.length];
    return {id:'meditation-'+date,date,title:theme.title,seconds:600,ambience:'Soft ocean',cues:[
      [0,'Welcome. This is ten minutes for yourself. Find a comfortable position. You may close your eyes, or keep a soft gaze. Let your breathing stay natural. Nothing needs to be achieved.'],
      [45,'Feel where your body is supported. Notice your feet, your seat, and your hands. Let your shoulders settle. For these few moments, you can simply be here.'],
      [100,'Bring your attention to '+anchor+'. '+theme.anchor+' Stay with a few ordinary breaths.'],
      [160,'Your attention may have wandered. That is part of this practice. Notice where it went, without judging it. Gently return to '+anchor+'.'],
      [220,theme.notice+' Let the next few breaths arrive at their own pace.'],
      [280,'We are around the middle of this practice. Notice whether anything feels different, or whether it feels the same. Both are welcome. There is no special state to reach.'],
      [340,theme.anchor+' If this focus is not comfortable, choose the contact of your feet instead. You can adjust your position whenever you need to.'],
      [400,'For a little while, allow your attention to be wider. Include your breath, your body, and the sounds around you. Let experience move without having to hold onto it.'],
      [470,'Return to one simple point of contact. '+theme.notice+' Each return is a moment of practice.'],
      [540,'In our last minute, notice one thing that supported you. It might be a breath, a sound, or the decision to pause. Consider carrying a little of this gentleness into your next activity.'],
      [585,'Begin to notice the room again. Move your fingers or toes if you like. When you are ready, open your eyes. Thank you for making this time for yourself.']
    ].map(([at,text])=>({at,text}))};
  }
  let selected=daily(),elapsed=0,startedAt=0,running=false,volume=.8,previousVolume=.8;
  const seconds=()=>Math.max(0,Math.min(600,elapsed+(running?(Date.now()-startedAt)/1000:0)));

  const elapsedText=value=>T.format(Math.floor(value));

  function stop(){if(running)elapsed=seconds();running=false;}
  function start(){T.pauseMusic();if(seconds()>=600)elapsed=0;startedAt=Date.now();running=true;T.redraw();}
  function seek(value){const resume=running;stop();elapsed=Math.max(0,Math.min(600,Number(value)||0));if(resume&&elapsed<600)start();else T.redraw();}
  function setVolume(value){volume=Math.max(0,Math.min(1,Number(value)||0));if(volume>0)previousVolume=volume;document.querySelectorAll('[data-meditation-volume]').forEach(el=>el.value=Math.round(volume*100));const mute=document.querySelector('[data-meditation-mute]');if(mute){mute.innerHTML=T.icon(volume===0?'muted':'volume',22);mute.setAttribute('aria-label',volume===0?'Unmute meditation':'Mute meditation');mute.setAttribute('aria-pressed',String(volume===0));}}
  function choose(session){stop();selected=JSON.parse(JSON.stringify(session));elapsed=0;P.go('Toolbox','meditation');}
  const isSaved=()=>S.state.wellness.saved.some(x=>x.id===selected.id);
  const skipIcon=forward=>`<svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><g ${forward?'transform="translate(32 0) scale(-1 1)"':''}><path d="M8.22 8.22A11 11 0 1 1 5 16M8.22 3.22V8.22H13.22" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></g><text x="16" y="16" fill="currentColor" font-family="Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">15</text></svg>`;
  function render(){const current=seconds(),started=running||elapsed>0,finished=current>=600;return T.heading('Meditation',`${selected.date!==P.today()?'<button class="wire-button" type="button" data-meditation-today>Today</button>':''}<button class="wire-button" type="button" data-meditation-saved>Saved sessions</button><button class="wire-button" type="button" data-meditation-save ${isSaved()?'disabled':''}>${T.icon('save',20)}${isSaved()?'Saved':'Save session'}</button>`)+`<div class="meditation-layout"><section class="meditation-start ${running?'is-playing':''}"><div class="meditation-orb" aria-hidden="true"></div><h2>${E(selected.title)}</h2><p>${selected.date===P.today()?'Today':E(selected.date)} · 10 min</p><div class="meditation-clock" data-meditation-time>${T.format(600-current)}</div></section><section class="meditation-player" aria-label="Meditation player"><div class="meditation-track"><div class="meditation-cover" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 32 32" fill="none"><path d="M4 11C8 6 12 6 16 11S24 16 28 11M4 17C8 12 12 12 16 17S24 22 28 17M4 23C8 18 12 18 16 23S24 28 28 23" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div><div class="player-track"><strong>${E(selected.title)}</strong><span>Mindfulness · 10 min</span></div></div><div class="meditation-transport"><button class="icon-button meditation-skip" type="button" data-meditation-seek="-15" aria-label="Rewind 15 seconds">${skipIcon(false)}</button><button class="meditation-play ${!started?'is-idle':''}" type="button" data-meditation-toggle aria-label="${running?'Pause meditation':finished?'Restart meditation':started?'Resume meditation':'Start meditation'}">${T.icon(running?'pause':'play',25)}${!started?'<span>Start</span>':''}</button><button class="icon-button meditation-skip" type="button" data-meditation-seek="15" aria-label="Forward 15 seconds">${skipIcon(true)}</button></div><div class="meditation-volume"><button class="icon-button" type="button" data-meditation-mute aria-label="${volume===0?'Unmute meditation':'Mute meditation'}" aria-pressed="${volume===0}">${T.icon(volume===0?'muted':'volume',22)}</button><input type="range" min="0" max="100" value="${Math.round(volume*100)}" data-meditation-volume aria-label="Meditation volume"></div><div class="meditation-timeline"><span data-meditation-elapsed>${elapsedText(current)}</span><input type="range" min="0" max="600" step="1" value="${Math.floor(current)}" style="--meditation-progress:${current/6}%" data-meditation-progress aria-label="Meditation progress" aria-valuetext="${elapsedText(current)} of 10:00"><span>10:00</span></div></section></div>`;}
  function saved(){return T.heading('Saved meditation sessions','','Toolbox','meditation')+`<section>${S.state.wellness.saved.slice().reverse().map(s=>`<article class="saved-meditation-row"><div class="person-copy"><strong>${E(s.title)}</strong><p>${E(s.date)} · 10 min</p></div><button class="wire-button" type="button" data-meditation-open="${E(s.id)}">Open</button>${T.button(`data-meditation-remove="${E(s.id)}"`,'Remove saved '+s.title,'trash')}</article>`).join('')||'<p class="detail-empty">No saved sessions yet.</p>'}</section>`;}
  function paint(){const onPage=location.hash.includes('meditation');if(window.MeditationVoice)window.MeditationVoice.sync({id:selected.id,cues:selected.cues,time:seconds(),running:running&&onPage,volume});if(!onPage)return;const value=seconds();document.querySelectorAll('[data-meditation-time]').forEach(el=>el.textContent=T.format(600-value));const progress=document.querySelector('[data-meditation-progress]');if(progress&&!progress.matches(':active')){progress.value=Math.floor(value);progress.style.setProperty('--meditation-progress',value/6+'%');progress.setAttribute('aria-valuetext',elapsedText(value)+' of 10:00');const time=document.querySelector('[data-meditation-elapsed]');if(time)time.textContent=elapsedText(value);}}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-meditation-today'))choose(daily());if(b.hasAttribute('data-meditation-toggle')){if(running){stop();T.redraw();}else start();}if(b.hasAttribute('data-meditation-seek'))seek(seconds()+Number(b.dataset.meditationSeek));if(b.hasAttribute('data-meditation-mute'))setVolume(volume===0?previousVolume:0);if(b.hasAttribute('data-meditation-save')){S.change(s=>{if(!s.wellness.saved.some(x=>x.id===selected.id))s.wellness.saved.push(JSON.parse(JSON.stringify(selected)));},'wellness');T.redraw();}if(b.hasAttribute('data-meditation-saved')){stop();P.go('Toolbox','meditation-saved');}if(b.hasAttribute('data-meditation-open')){const session=S.state.wellness.saved.find(s=>s.id===b.dataset.meditationOpen);if(session)choose(session);}if(b.hasAttribute('data-meditation-remove')){S.change(s=>s.wellness.saved=s.wellness.saved.filter(x=>x.id!==b.dataset.meditationRemove),'wellness');T.redraw();}});
  document.addEventListener('input',e=>{if(e.target.matches('[data-meditation-volume]'))setVolume(Number(e.target.value)/100);if(e.target.matches('[data-meditation-progress]')){const value=Number(e.target.value);e.target.style.setProperty('--meditation-progress',value/6+'%');e.target.setAttribute('aria-valuetext',elapsedText(value)+' of 10:00');const time=document.querySelector('[data-meditation-elapsed]');if(time)time.textContent=elapsedText(value);}});
  document.addEventListener('change',e=>{if(e.target.matches('[data-meditation-progress]'))seek(e.target.value);});
  setInterval(()=>{if(running&&seconds()>=600){stop();elapsed=600;T.redraw();announce('Meditation complete.');}paint();},500);
  window.addEventListener('pagehide',stop);
  window.Wellness={render,saved,stop,daily};
})();

</script>
<script data-source="body-rooms.js">
(() => {
  const S=Articul8,P=Product,T=ToolPages,E=P.esc;
  const people=[{id:'alex',name:'Alex',course:'COMPSCI 188',task:'Computer Vision Assignment 1',tags:'computer vision coding programming'},{id:'sam',name:'Sam',course:'ECON 1',task:'Microeconomics Homework 2',tags:'economics problem set'},{id:'adam',name:'Adam',course:'COMPSCI 188',task:'Image Classification Project',tags:'computer vision project coding'},{id:'cathy',name:'Cathy',course:'RHETOR 10',task:'Rhetoric Essay 1',tags:'writing essay reading'},{id:'mina',name:'Mina',course:'ECON 1',task:'Consumer Choice Reading',tags:'economics reading'}];
  let query='',hostId='alex',roomCourse='',returnPage='Toolbox',discussion=false,cameraStream=null,micStream=null,shareStream=null,mediaEpoch=0;
  const host=()=>people.find(p=>p.id===hostId)||people[0];
  const here=()=>location.hash.startsWith('#room');
  const norm=text=>text.toLowerCase().replace(/\s+/g,' ').trim();
  function rows(){const terms=norm(query).split(' ').filter(Boolean),matches=people.filter(p=>terms.every(word=>norm([p.name,p.course,p.task,p.tags].join(' ')).includes(word)));return matches.map(p=>`<article class="body-result"><span class="avatar">${p.name[0]}</span><div class="person-copy"><strong>${p.name}</strong><p>${p.task} · ${p.course}</p></div><button type="button" class="wire-button" data-body-join="${p.id}">Start focus</button></article>`).join('')||'<p class="detail-empty">No matches. Try a course or task.</p>';}
  function directory(){return T.heading('Body Doubling')+`<form class="detail-search" id="body-search">${T.icon('search')}<input aria-label="Search body doubles" placeholder="Search tasks, courses or people" value="${E(query)}" autocomplete="off"><button class="wire-button" type="submit">Search</button></form><section class="body-results" aria-live="polite">${rows()}</section>`;}
  function find(course=''){query=course;returnPage=location.hash.startsWith('#courses')?'Courses':'Toolbox';P.go('Toolbox','body');}
  function join(id,course='',begin=false){if(!people.some(p=>p.id===id))return;hostId=id;roomCourse=course||host().course;if(location.hash.startsWith('#courses'))returnPage='Courses';else if(!here())returnPage='Toolbox';discussion=false;P.go('Room',id);if(begin)startFocus();}
  function startFocus(){const existing=S.state.activeSession;if(existing&&existing.status!=='review'){P.go('Room',hostId);announce('Your current focus session continues here.');return;}const task=P.currentTask()||S.state.tasks.find(t=>t.course===roomCourse&&!t.done);FocusUI.start({taskId:task?.id,minutes:S.state.settings.focusMinutes,selected:['timer','body'],origin:'Room',roomId:hostId});}
  function chats(){return (S.state.social.messages[hostId]||[]).map(m=>`<div class="room-chat-line"><strong>You</strong>${E(m.text)}</div>`).join('')||'<p class="detail-note">Messages stay in this preview.</p>';}
  function render(path){if(people.some(p=>p.id===path))hostId=path;const person=host(),a=S.state.activeSession,ongoing=a&&a.status!=='review';const peers=[person,...people.filter(p=>p.id!==person.id),{id:'you',name:S.state.profile.name||'You',task:P.currentTask()?.title||'Your focus task'}];return T.heading(person.name+'’s Room',ongoing?`<span data-room-time></span><button class="wire-button" type="button" data-room-finish>End focus</button>`:a?.status==='review'?'<button class="wire-button" type="button" data-room-summary>View summary</button>':'<button class="wire-button solid" type="button" data-room-start>Start focus</button>',returnPage,returnPage==='Toolbox'?'body':'').replace('detail-heading','detail-heading room-heading')+`${shareStream?'<div class="room-share-preview"><video data-share-video autoplay muted playsinline></video></div>':''}<section class="room-grid">${peers.map(p=>`<article class="room-person"><div class="camera-frame"><span class="camera-initial">${E(p.name[0].toUpperCase())}</span>${p.id==='you'?`<video data-self-video autoplay muted playsinline ${cameraStream?'':'hidden'}></video>`:''}</div><h2>${E(p.name)}</h2><p title="${E(p.task)}">${E(p.task)}</p></article>`).join('')}</section><div class="room-toolbar"><button type="button" data-room-share aria-pressed="${!!shareStream}">${T.icon('screen',28)}<span>${shareStream?'Stop sharing':'Share Screen'}</span></button><button type="button" data-room-discussion aria-pressed="${discussion}">${T.icon('chat',28)}<span>Discussion Box</span></button><button type="button" data-room-settings>${T.icon('settings',28)}<span>Settings</span></button><button type="button" data-room-mic aria-pressed="${!!micStream}" aria-label="${micStream?'Mute microphone':'Unmute microphone'}">${T.icon(micStream?'mic':'muted',28)}<span>${micStream?'Mute':'Unmute'}</span></button></div>${discussion?`<aside class="room-discussion" aria-label="Discussion"><header><h2>Discussion</h2>${T.button('data-room-discussion','Close discussion','close')}</header><div class="room-chat-log">${chats()}</div><form id="room-chat"><input aria-label="Discussion message" placeholder="Message" maxlength="2000" required><button class="icon-button" type="submit" aria-label="Send message">${T.icon('arrow')}</button></form></aside>`:''}`;}
  function mount(){const self=document.querySelector('[data-self-video]');if(self&&cameraStream){self.srcObject=cameraStream;self.play().catch(()=>{});}const share=document.querySelector('[data-share-video]');if(share&&shareStream){share.srcObject=shareStream;share.play().catch(()=>{});}const log=document.querySelector('.room-chat-log');if(log)log.scrollTop=log.scrollHeight;paint();}
  function stopStream(stream){stream?.getTracks().forEach(t=>t.stop());}
  function leave(){mediaEpoch++;stopStream(cameraStream);stopStream(micStream);stopStream(shareStream);cameraStream=micStream=shareStream=null;discussion=false;}
  async function toggleMedia(kind){const token=mediaEpoch;if(kind==='camera'&&cameraStream){stopStream(cameraStream);cameraStream=null;T.redraw();settings();return;}if(kind==='mic'&&micStream){stopStream(micStream);micStream=null;T.redraw();return;}if(kind==='screen'&&shareStream){stopStream(shareStream);shareStream=null;T.redraw();return;}
    if(!navigator.mediaDevices){announce('Media capture is unavailable in this browser.');return;}try{const stream=kind==='screen'?await navigator.mediaDevices.getDisplayMedia({video:true,audio:false}):await navigator.mediaDevices.getUserMedia(kind==='camera'?{video:true,audio:false}:{audio:true,video:false});if(token!==mediaEpoch||!here()){stopStream(stream);return;}if(kind==='camera')cameraStream=stream;else if(kind==='mic')micStream=stream;else shareStream=stream;stream.getTracks().forEach(track=>track.onended=()=>{if(kind==='camera')cameraStream=null;else if(kind==='mic')micStream=null;else shareStream=null;if(here())T.redraw();});T.redraw();if(kind==='camera')settings();}catch(e){announce(e.name==='NotAllowedError'?'Permission was not granted.':'This device could not be opened.');}}
  function settings(){const d=P.open('Room settings',`<div class="room-settings"><p class="detail-note">Camera, microphone and screen stay in this local preview.</p><label>Display name<input type="text" aria-label="Room display name" value="${E(S.state.profile.name||'You')}" maxlength="80"></label><button type="button" class="wire-button" data-local-camera>${cameraStream?'Turn camera off':'Turn camera on'}</button><button type="button" class="wire-button solid" data-room-save-settings>Save</button></div>`);d.querySelector('[data-local-camera]').onclick=()=>toggleMedia('camera');d.querySelector('[data-room-save-settings]').onclick=()=>{const value=d.querySelector('input').value.trim();S.change(s=>s.profile.name=value==='You'?'':value,'profile');d.close();T.redraw();};}
  function paint(){const el=document.querySelector('[data-room-time]'),a=S.state.activeSession;if(!el||!a)return;const phase=a.phases[a.index];if(a.status==='review'){T.redraw();return;}const ms=a.phaseElapsedMs+(a.status==='running'?Date.now()-a.phaseStartedAt:0);el.textContent=T.format(phase?.seconds?Math.max(0,phase.seconds-ms/1000):ms/1000);}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-body-join'))join(b.dataset.bodyJoin,'',true);if(b.hasAttribute('data-room-start'))startFocus();if(b.hasAttribute('data-room-finish')){FocusUI.finish();P.go('Focus');}if(b.hasAttribute('data-room-summary'))P.go('Focus');if(b.hasAttribute('data-room-share'))toggleMedia('screen');if(b.hasAttribute('data-room-mic'))toggleMedia('mic');if(b.hasAttribute('data-room-discussion')){discussion=!discussion;T.redraw();if(discussion)document.querySelector('#room-chat input')?.focus();}if(b.hasAttribute('data-room-settings'))settings();});
  document.addEventListener('input',e=>{if(e.target.matches('#body-search input')){query=e.target.value;document.querySelector('.body-results').innerHTML=rows();}});
  document.addEventListener('submit',e=>{if(e.target.id==='body-search'){e.preventDefault();query=e.target.querySelector('input').value;document.querySelector('.body-results').innerHTML=rows();}if(e.target.id==='room-chat'){e.preventDefault();const input=e.target.querySelector('input'),text=input.value.trim();if(text){S.change(s=>(s.social.messages[hostId]||=[]).push({id:S.uid(),text,at:Date.now()}),'social');T.redraw();document.querySelector('#room-chat input')?.focus();}}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&discussion&&document.getElementById('agent').hidden&&!document.querySelector('dialog[open]')){discussion=false;T.redraw();}});
  setInterval(paint,500);window.addEventListener('pagehide',leave);
  window.BodyRooms={directory,find,join,render,mount,leave};
})();

</script>
<script data-source="insights.js">
(() => {
  const P=Product,S=Articul8,T=ToolPages,E=P.esc,DAY=86400000;
  const dayOf=stamp=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(stamp));
  const add=(date,n)=>new Date(Date.parse(date+'T12:00Z')+n*DAY).toISOString().slice(0,10);
  const records=()=>S.state.sessions.filter(r=>Number.isFinite(r.finishedAt)&&Number.isFinite(r.focusMs)&&r.focusMs>=0);
  const total=arr=>arr.reduce((n,r)=>n+r.focusMs,0);
  const minutes=ms=>Number((ms/60000).toFixed(1)).toLocaleString('en-US');
  const duration=ms=>ms>=3600000?Number((ms/3600000).toFixed(1))+' h':ms>=60000?minutes(ms)+' min':Math.floor(ms/1000)+' sec';
  function chart(buckets,title){const max=Math.max(60000,...buckets.map(b=>b.value));return `<div class="data-chart"><h2>${E(title)}</h2><div class="activity-bars" role="img" aria-label="${E(buckets.map(b=>b.full+': '+duration(b.value)).join('; '))}">${buckets.map(b=>`<div class="activity-bar" title="${E(b.full+': '+duration(b.value))}"><i style="height:${b.value?Math.max(2,b.value/max*145):2}px;${!b.value?'background:#eaeaea':''}"></i><span>${E(b.label)}</span></div>`).join('')}</div><div class="chart-scale"><span>${E(buckets[0]?.full||'')}</span><span>${E(buckets.at(-1)?.full||'')}</span></div></div>`;}
  function summary(record){const end=dayOf(record.finishedAt),dates=Array.from({length:7},(_,i)=>add(end,i-6)),week=records().filter(r=>dayOf(r.finishedAt)>=dates[0]&&dayOf(r.finishedAt)<=end),previous=week.filter(r=>r.id!==record.id&&r.focusMs>0),average=previous.length?total(previous)/previous.length:0;const difference=average?Math.round((record.focusMs-average)/average*100):null;const compare=difference===null?'Your first focus session this week.':difference>0?difference+'% longer than your earlier sessions this week.':difference===0?'In line with your average session this week.':Math.abs(difference)+'% shorter than your weekly average. Short sessions count, too.';const task=S.state.tasks.find(t=>t.id===record.taskId),next=task&&!task.done?task:S.state.tasks.find(t=>!t.done),nextTitle=next?.title||'a new task';const buckets=dates.map(d=>({full:d,label:new Date(d+'T12:00Z').toLocaleDateString('en-US',{weekday:'narrow',timeZone:'UTC'}),value:total(week.filter(r=>dayOf(r.finishedAt)===d))}));return T.heading('Session complete',`<button class="wire-button" type="button" data-focus-stats>Data</button><button class="wire-button" type="button" data-focus-done>Done</button>`,S.state.activeSession?.origin||'Calendar',S.state.activeSession?.originPath||'')+`<div class="summary-top">${chart(buckets,'This week')}<div class="summary-stat"><p>In this session, you focused for</p><strong>${minutes(record.focusMs)} minutes</strong><p>${E(record.taskTitle)}</p><p class="detail-note">${record.steps.length} ${record.steps.length===1?'subtask':'subtasks'} completed</p></div></div><div class="summary-middle"><section><h2>Compared to this week</h2><p>${compare}</p>${average?`<p class="detail-note">Earlier-session average: ${minutes(average)} min</p>`:''}</section><section><h2>Subtasks you finished</h2>${record.steps.length?`<ul>${record.steps.map(s=>`<li>${T.icon('checklist',20)}${E(s.text)}</li>`).join('')}</ul>`:'<p>No subtasks checked off this time.</p>'}</section></div><section class="next-steps"><h2>Next Steps</h2><div class="next-step-grid"><button type="button" data-next-break><strong>15 minutes break</strong><span>Step away for a moment</span></button><button type="button" data-next-continue="${E(next?.id||'')}" title="Continue with ${E(nextTitle)}" aria-label="Continue with ${E(nextTitle)}"><strong>Continue: ${E(nextTitle)}</strong><span>${Math.min(25,Math.max(5,Math.round(record.focusMs/60000)||10))} min focus</span></button><button type="button" data-next-chat><strong>Chat with agent</strong><span>Plan what comes next</span></button></div></section>`;}
  const lengths={day:1,week:7,quarter:90,semester:180,year:365};
  let range='week',offset=0;
  function profile(){const length=lengths[range],end=add(P.today(),-offset*length),start=add(end,-length+1),prevStart=add(start,-length),data=records().filter(r=>dayOf(r.finishedAt)>=start&&dayOf(r.finishedAt)<=end),prior=records().filter(r=>dayOf(r.finishedAt)>=prevStart&&dayOf(r.finishedAt)<start),focused=total(data),prev=total(prior),sessions=data.filter(r=>r.focusMs>0),days=new Set(sessions.map(r=>dayOf(r.finishedAt))).size;let buckets=[];if(range==='day'){buckets=Array.from({length:6},(_,i)=>({label:String(i*4).padStart(2,'0'),full:String(i*4).padStart(2,'0')+':00–'+String((i+1)*4).padStart(2,'0')+':00',value:total(data.filter(r=>Math.floor(Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'2-digit',hourCycle:'h23'}).format(new Date(r.finishedAt)))/4)===i))}));}else{const count=range==='week'?7:range==='quarter'?9:range==='semester'?12:12;for(let i=0;i<count;i++){const first=add(start,Math.floor(i*length/count)),last=add(start,Math.floor((i+1)*length/count)-1);buckets.push({full:first+(last===first?'':' – '+last),label:range==='week'?new Date(first+'T12:00Z').toLocaleDateString('en-US',{weekday:'narrow',timeZone:'UTC'}):String(Number(first.slice(5,7)))+'/'+String(Number(first.slice(8))),value:total(data.filter(r=>dayOf(r.finishedAt)>=first&&dayOf(r.finishedAt)<=last))});}}
    const usageDays=Object.entries(S.state.usage.days).filter(([d])=>d>=start&&d<=end),appMs=usageDays.reduce((n,[,v])=>n+(v.ms||0),0),visits=usageDays.reduce((n,[,v])=>n+(v.visits||0),0),steps=data.reduce((n,r)=>n+(r.steps?.length||0),0),average=sessions.length?focused/sessions.length:0;
    const compare=prev?(focused===prev?'The same focus time as the previous period.':Math.abs(Math.round((focused-prev)/prev*100))+'% '+(focused>prev?'more':'less')+' focus time than the previous period.'):'No earlier period to compare yet.';
    const bands=['Morning','Afternoon','Evening','Night'],scores=[0,0,0,0];sessions.forEach(r=>{const h=Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',hourCycle:'h23'}).format(new Date(r.startedAt||r.finishedAt)));scores[h>=6&&h<12?0:h>=12&&h<18?1:h>=18&&h<24?2:3]++;});const best=scores.indexOf(Math.max(...scores)),habit=sessions.length?bands[best]+' is your most frequent focus time.':'Your focus pattern will appear after your first session.';const suggestion=!sessions.length?'Start with one small task and a short timer.':average<10*60000?'Short sessions are part of your routine. Try another manageable 10 minutes.':days>=3?'You returned on '+days+' days. Keep a time of day that works for you.':'Try a short session at the same time tomorrow.';
    return T.heading('Data','','Profile')+`<div class="data-filters" aria-label="Data period">${[['day','Day'],['week','Week'],['quarter','Quarter'],['semester','Semester'],['year','Year']].map(([id,label])=>`<button type="button" data-data-range="${id}" aria-pressed="${range===id}">${label}</button>`).join('')}</div><div class="data-period">${T.button('data-data-offset="1"','Previous period','back')}<h2>${start===end?start:start+' – '+end}${range==='quarter'?' · 90 days':range==='semester'?' · 180 days':''}</h2>${T.button('data-data-offset="-1"','Next period','arrow',offset===0?'disabled':'')}</div><div class="data-layout">${chart(buckets,'Focus time')}<div class="data-metrics"><div><strong>${duration(focused)}</strong><span>Focused</span></div><div><strong>${sessions.length}</strong><span>Focus sessions</span></div><div><strong>${days}</strong><span>Active focus days</span></div><div><strong>${steps}</strong><span>Subtasks completed</span></div><div><strong>${duration(appMs)}</strong><span>Time in app</span></div><div><strong>${visits}</strong><span>App visits</span></div></div></div><div class="data-insights"><section><h2>Your pattern</h2><p>${habit}</p>${sessions.length?`<p>${duration(average)} per focus session on average.</p>`:''}<p>${compare}</p></section><section><h2>Try next</h2><p>${suggestion}</p></section></div><section class="detail-section"><h2>History</h2>${data.slice().sort((a,b)=>b.finishedAt-a.finishedAt).slice(0,20).map(r=>`<div class="data-history-row"><div>${E(r.taskTitle)}<small>${dayOf(r.finishedAt)} · ${r.steps?.length||0} subtasks</small></div><span>${duration(r.focusMs)}</span></div>`).join('')||'<p class="detail-empty">No sessions in this period.</p>'}</section>`;
  }
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-data-range')){range=b.dataset.dataRange;offset=0;T.redraw();}if(b.hasAttribute('data-data-offset')){offset=Math.max(0,offset+Number(b.dataset.dataOffset));T.redraw();}if(b.hasAttribute('data-next-break'))T.startBreak();if(b.hasAttribute('data-next-continue')){const a=S.state.activeSession,record=S.state.sessions.find(r=>r.id===a?.id);if(b.dataset.nextContinue)FocusUI.start({taskId:b.dataset.nextContinue,minutes:Math.min(25,Math.max(5,Math.round((record?.focusMs||0)/60000)||10)),selected:['timer'],origin:a?.origin||'Toolbox'});else FocusUI.setup();}if(b.hasAttribute('data-next-chat')){const record=S.state.sessions.find(r=>r.id===S.state.activeSession?.id);if(record?.taskId)S.selectTask(record.taskId);setAgent(true);}});
  // Count only foreground, focused time; a suspended tab cannot add hours of idle time.
  let usageAt=Date.now(),tracking=document.visibilityState==='visible'&&document.hasFocus();
  function usage(){const now=Date.now(),delta=now-usageAt;usageAt=now;if(tracking&&delta>0&&delta<60000){const date=dayOf(now);S.change(s=>{const entry=s.usage.days[date]||={ms:0,visits:0};entry.ms+=delta;},'usage');}tracking=document.visibilityState==='visible'&&document.hasFocus();}
  S.change(s=>{const entry=s.usage.days[P.today()]||={ms:0,visits:0};entry.visits++;},'usage');
  document.addEventListener('visibilitychange',usage);window.addEventListener('focus',usage);window.addEventListener('blur',usage);window.addEventListener('pagehide',usage);setInterval(usage,15000);
  window.Insights={summary,profile};
})();

</script>
  <script data-source="pages.js">
(() => {
  const content=document.getElementById('page-content'),app=document.querySelector('.app'),home=document.querySelector('.workspace'),todo=document.querySelector('.todo');
  const names=['Home','Calendar','Toolbox','Workflow','Courses','Profile','Focus','Room','Break'];
  let currentPage='Home',path='';
  const renders={Calendar:()=>CalendarUI.render(),Toolbox:()=>ProductPages.toolbox(path),Workflow:()=>WorkflowUI.render(),Courses:()=>ProductPages.courses(),Profile:()=>ProductPages.profile(path),Focus:()=>FocusUI.render(),Room:()=>BodyRooms.render(path),Break:()=>ToolPages.breakPage()};
  function render(){
    if(currentPage==='Home'||currentPage==='Calendar')return;
    const top=content.scrollTop,viewport=content.querySelector('.canvas-viewport'),position=viewport?{left:viewport.scrollLeft,top:viewport.scrollTop}:null;
    const focused=document.activeElement;
    const identity=focused&&content.contains(focused)?['data-focus-step','data-tool-step','data-tool-select','data-course-task-check','data-favorite','data-helpful','data-list-check','data-list-title','data-meditation-progress','data-meditation-toggle','data-meditation-seek','data-meditation-mute'].find(a=>focused.hasAttribute(a)):null;
    const value=identity?focused.getAttribute(identity):null;
    content.innerHTML=renders[currentPage]();content.scrollTop=top;ToolPages.mountWheels();BodyRooms.mount();
    if(position){const canvas=content.querySelector('.canvas-viewport');if(canvas){canvas.scrollLeft=position.left;canvas.scrollTop=position.top;}}
    if(identity)Array.from(content.querySelectorAll('['+identity+']')).find(e=>e.getAttribute(identity)===value)?.focus({preventScroll:true});
    if(currentPage==='Focus')FocusUI.paint();
  }
  function navigate(name,nextPath='',updateHash=true){
    if(!names.includes(name))name='Home';
    if(name==='Toolbox'&&currentPage!=='Toolbox')Articul8.change(s=>{s.tools.selected=[];s.tools.customSelection=false;},'tool-selection-reset');
    CalendarUI.unmount();ProductPages.unmount();Product.closeModal();
    currentPage=name;path=nextPath;
    if(updateHash)history.pushState(null,'','#'+name.toLowerCase()+(path?'/'+encodeURIComponent(path):''));
    const isHome=name==='Home';app.classList.toggle('inner-page',!isHome);home.hidden=!isHome;todo.hidden=true;app.classList.remove('todo-open');content.hidden=isHome;content.setAttribute('aria-label',name);
    document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    if(!isHome){content.innerHTML=renders[name]();if(name==='Calendar')CalendarUI.mount(content);ToolPages.mountWheels();BodyRooms.mount();}
    if(matchMedia('(max-width:760px)').matches)Articul8.change(s=>{s.collapsed=true;},'sidebar');
    content.scrollTop=0;setAgent(false);notice.hidden=true;document.title='Concentr8 · '+name;
    window.dispatchEvent(new CustomEvent('articul8:navigate',{detail:{page:name}}));FocusUI.paint();
  }
  function fromHash(){const parts=location.hash.slice(1).split('/');navigate(names.find(n=>n.toLowerCase()===parts[0])||'Home',decodeURIComponent(parts[1]||''),false);}
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
  window.addEventListener('articul8:go',e=>navigate(e.detail.page,e.detail.path||''));
  window.addEventListener('popstate',fromHash);
  window.addEventListener('articul8:rerender',render);
  window.addEventListener('articul8:change',e=>{
    const reason=e.detail.reason;
    if(['draft','sidebar','calendar-context','sound','workflow-name'].includes(reason))return;
    if(currentPage==='Toolbox'&&['tasks','message','task-context','context','tools','restore','calendar','wellness'].includes(reason))render();
    if(currentPage==='Workflow'&&['workflow','restore'].includes(reason))render();
    if(currentPage==='Courses'&&['tasks','courses','calendar','restore'].includes(reason))render();
    if(currentPage==='Focus'&&['tasks','focus','calendar','restore'].includes(reason))render();
    if(currentPage==='Profile'&&['focus','restore'].includes(reason))render();
    if(currentPage==='Room'&&['focus','tasks','restore'].includes(reason))render();
  });
  fromHash();
})();
