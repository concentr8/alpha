  }
  function syncFilterChips() {
    if(!root)return;
    root.querySelectorAll('[data-cal-filter="tasks"]').forEach(input=>{input.checked=showTasks;});
    root.querySelectorAll('[data-cal-external]').forEach(input=>{input.checked=visibleExternal.has(input.dataset.calExternal);});
    root.querySelectorAll('[data-cal-chip="google"]').forEach(button=>button.setAttribute('aria-pressed',String(visibleExternal.has(button.dataset.calendarId))));
  }
  window.addEventListener('articul8:change',event=>{if(['calendar','restore','tasks','courses'].includes(event.detail.reason)){if(drag)cancelDrag();redraw();}});

  // Wireframe-only extraction of explicit dates/times; no AI service or inferred scheduling.
  function interpret(text,context) {
    let source=text, date=context?.start.slice(0,10)||today();
    const explicit=source.match(/\b(20\d{2}-\d{2}-\d{2})\b/);
    if(explicit){date=explicit[1];source=source.replace(explicit[0],' ');}
    else if(/后天/.test(source)){date=dayAdd(today(),2);source=source.replace(/后天/g,' ');}
    else if(/tomorrow|明天/i.test(source)){date=dayAdd(today(),1);source=source.replace(/tomorrow|明天/ig,' ');}
    else if(/today|今天/i.test(source)){date=today();source=source.replace(/today|今天/ig,' ');}
    else {
      const weekday=source.match(/(?:(next|this)\s+)?(monday|tuesday|wednesday|thursday|friday|saturday|sunday)|(下|本|这)?(?:周|星期)([一二三四五六日天])/i);
      if(weekday){
        const index=weekday[2]?['monday','tuesday','wednesday','thursday','friday','saturday','sunday'].indexOf(weekday[2].toLowerCase()):Math.min(6,'一二三四五六日天'.indexOf(weekday[4]));
        let offset=weekday[1]?.toLowerCase()==='next'||weekday[3]==='下'?7:0;
        date=dayAdd(weekStart(today()),index+offset);
        if(!weekday[1]&&!weekday[3]&&date<today())date=dayAdd(date,7);
        source=source.replace(weekday[0],' ');
      }
    }
    if(!Number.isFinite(stamp(date))||iso(stamp(date)).slice(0,10)!==date)return null;
    const timePattern=/(上午|早上|下午|晚上|中午|凌晨)?\s*(\d{1,2})(?:(?::([0-5]\d))|(点半|点(?:[0-5]?\d分?)?))\s*(am|pm)?|\b(\d{1,2})\s*(am|pm)\b/ig;
    const matches=[...source.matchAll(timePattern)];
    const times=matches.map((m,index)=>{
      let hour=Number(m[2]||m[6]),minute=Number(m[3]||0);
      if(m[4]?.includes('半'))minute=30;
      else if(m[4]?.match(/\d+/))minute=Number(m[4].match(/\d+/)[0]);
      const firstPeriod=matches[0]?.[1]||matches[0]?.[5]||matches[0]?.[7]||'';
      const period=(m[1]||m[5]||m[7]||(index>0&&m[4]?firstPeriod:'')).toLowerCase();
      if(/下午|晚上|中午|pm/.test(period)&&hour<12)hour+=12;
      if(/上午|早上|凌晨|am/.test(period)&&hour===12)hour=0;
      return hour<=23&&minute<60?hour*60+minute:NaN;
    });
    if(times.some(Number.isNaN)||times.length>2)return null;
    const kind=/deadline|\bdue\b|截止/i.test(text)?'deadline':context?.kind||'plan';
    if(kind==='plan'&&times.length<2&&!context)return null;
    if(!times.length&&!/today|tomorrow|今天|明天|后天|周|星期|20\d{2}-|monday|tuesday|wednesday|thursday|friday|saturday|sunday/i.test(text))return null;
    if(kind==='plan'&&!times.length&&!context)return null;
    let title=context?.title||source.replace(timePattern,' ').replace(/deadline|\bdue\b|截止(?:时间)?|帮我|请|安排|计划|从|到|写|(?:\b(?:schedule|plan|work on|on|at|from|to|until|by|for)\b)/ig,' ').replace(/[，。,:：–—-]+/g,' ').replace(/\s+/g,' ').trim();
    if(!title)return null;
    const start=at(date,times[0]??(context?mins(context.start):0));
    let end=kind==='deadline'?start:times.length>1?at(date,times[1]):iso(stamp(start)+(stamp(context.end)-stamp(context.start)));
    if(kind==='plan'&&end<=start){if(times.length===2&&times[1]<times[0])end=iso(stamp(end)+DAY);else return null;}
    return {id:context?.id,title:title.slice(0,200),kind,start,end,allDay:kind==='deadline'&&!times.length,taskId:context?.taskId||null,notes:context?.notes||''};
  }
  function messageMarkup(message) {
    const saved=message.eventId&&getEvent(message.eventId);
    if(saved)return `<button class="message-action" type="button" data-cal-message="${esc(message.id)}" data-cal-action="view">View in Calendar</button>`;
    if(message.proposal){const p=message.proposal;return `<div class="calendar-proposal"><span>Calendar draft</span><strong>${esc(p.title)}</strong><span>${p.kind==='deadline'?'Deadline · ':''}${esc(timeLabel(p))}</span><div class="cal-actions"><button class="wire-button" type="button" data-cal-message="${esc(message.id)}" data-cal-action="edit">Edit</button><button class="wire-button solid" type="button" data-cal-message="${esc(message.id)}" data-cal-action="save">${p.id?'Apply':'Add'}</button></div></div>`;}
    return `<button class="message-action" type="button" data-cal-message="${esc(message.id)}" data-cal-action="edit">${message.contextId?'Edit schedule':'+ Calendar'}</button>`;
  }
  function messageAction(button) {
    const message=store.state.messages.find(m=>m.id===button.dataset.calMessage);if(!message)return;
    if(button.dataset.calAction==='view'){
      const event=getEvent(message.eventId);if(!event)return;
      window.dispatchEvent(new CustomEvent('articul8:go',{detail:{page:'Calendar'}}));
      anchor=event.start.slice(0,10);miniMonth=anchor;scrollTop=Math.max(0,mins(event.start)/60*HOUR-HOUR);redraw();emitRange();details(event.id);return;
    }
    const context=message.contextId?getEvent(message.contextId):null;
    if((message.contextId&&!context)||(message.proposal?.id&&!getEvent(message.proposal.id))){announce('This event was deleted.');return;}
    const value=message.proposal||context||{title:message.text.slice(0,200),taskId:message.taskId};
    if(button.dataset.calAction==='save')store.saveEvent(value,message.id);else editor(value,message.id);
  }
  window.CalendarUI={render,mount,unmount,editor,details,interpret,messageMarkup,messageAction,timeLabel,getRange,setFilter(kind,id,visible) {
    if(kind==='tasks')showTasks=!!visible;
    else if(kind==='google'){if(visible)visibleExternal.add(String(id));else visibleExternal.delete(String(id));}
    syncFilterChips();drawEvents();drawMessages();
  },setExternal(value={}) {
    const priorCalendars=new Set(external.calendars.map(calendar=>calendar.id));
    const calendars=Array.isArray(value.calendars)?value.calendars.map(calendar=>({id:String(calendar.id),name:String(calendar.name||'Google calendar')})):[];
    const calendarIds=new Set(calendars.map(calendar=>calendar.id));
    const events=Array.isArray(value.events)?value.events.filter(event=>event&&event.kind==='google'&&event.readOnly===true&&event.id!=null&&event.calendarId!=null&&tools.validDate(String(event.start||'').slice(0,10))&&tools.validDate(String(event.end||'').slice(0,10))).map(event=>({...event,id:String(event.id),calendarId:String(event.calendarId),title:String(event.title||'Untitled event'),start:String(event.start),end:String(event.end),notes:String(event.notes||''),allDay:!!event.allDay})).filter(event=>calendarIds.has(event.calendarId)):[];
    external={events,calendars,status:['idle','loading','error','stale','ready','unconfigured','disconnected','signin'].includes(value.status)?value.status:'idle',updatedAt:value.updatedAt||null,message:value.message||''};
    const nextIds=new Set(external.calendars.map(calendar=>calendar.id));
    external.calendars.forEach(calendar=>{if(!priorCalendars.has(calendar.id))visibleExternal.add(calendar.id);});
    for(const id of visibleExternal)if(!nextIds.has(id))visibleExternal.delete(id);
    if(root)redraw();
  }};
})();

  <script data-source="elevenlabs.js">
/* Optional ElevenLabs voice through the Concentr8 server. ON by default.
   ?api=http://localhost:8000 uses another address (remembered), ?api=off turns it
   off (remembered). The browser never holds a key. */
(() => {
  const DEFAULT_API=window.Concentr8.api; /* the Concentr8 server on Azure, one address for everything (concentr8-server.js) */
  /* Voice needs a signed-in student: the token comes from Profile > Phone call. */
  const auth=()=>{try{const t=JSON.parse(localStorage.getItem('concentr8-server-v1')).token;return t?{Authorization:'Bearer '+t}:{};}catch(_){return {};}};
  let base=DEFAULT_API;
  try {
    const asked=new URLSearchParams(location.search).get('api');
    if(asked==='off')localStorage.setItem('articul8-api','off');
    else if(asked)localStorage.setItem('articul8-api',asked.replace(/\/$/,''));
    const saved=localStorage.getItem('articul8-api');
    if(saved==='off')base='';
    else if(saved)base=saved;
  } catch(_) {}
  if(!base)return;

  /* Listening: records the microphone and lets the backend turn it into text.
     It copies the few parts of the browser's SpeechRecognition that voice.js uses. */
  if(window.MediaRecorder&&navigator.mediaDevices) {
    window.Articul8SpeechEngine=class {
      start() {
        navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
          if(this.aborted){stream.getTracks().forEach(t=>t.stop());return;}
          this.stream=stream;this.chunks=[];this.recorder=new MediaRecorder(stream);
          this.recorder.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data);};
          this.recorder.onstop=()=>this.send();
          this.recorder.start();
          if(this.onstart)this.onstart();
        }).catch(e=>this.fail(e&&e.name==='NotAllowedError'?'not-allowed':'audio-capture'));
      }
      stop() {if(this.recorder&&this.recorder.state!=='inactive')this.recorder.stop();}
      abort() {
        this.aborted=true;this.release();
        if(this.recorder&&this.recorder.state!=='inactive'){this.recorder.onstop=null;this.recorder.stop();}
      }
      release() {if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;}
      fail(code) {this.release();if(this.onerror)this.onerror({error:code});}
      send() {
        this.release();
        if(this.aborted)return;
        const type=this.recorder.mimeType||'audio/webm';
        fetch(base+'/api/voice/transcribe',{method:'POST',headers:{'Content-Type':type,...auth()},body:new Blob(this.chunks,{type})})
          .then(r=>r.ok?r.json():Promise.reject(new Error('status '+r.status)))
          .then(data=>{
            const text=(data.text||'').trim();
            if(text&&this.onresult)this.onresult({results:[Object.assign([{transcript:text}],{isFinal:true})]});
            if(this.onend)this.onend();
          }).catch(()=>this.fail('network'));
      }
    };
  }

  /* Speaking: reads each meditation cue aloud at its time. Wellness calls sync() twice a second. */
  const audio=new Audio();
  const clips=new Map();
  const spoken=new Set();
  let sessionId='',lastTime=0,speaking=false;
  audio.addEventListener('ended',()=>{speaking=false;});

  function clip(text) {
    if(!clips.has(text)) {
      clips.set(text,fetch(base+'/api/voice/speak',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({text})})
        .then(r=>r.ok?r.blob():Promise.reject(new Error('status '+r.status)))
        .then(blob=>URL.createObjectURL(blob))
        .catch(error=>{clips.delete(text);throw error;}));
    }
    return clips.get(text);
  }

  window.MeditationVoice={
    sync({id,cues,time,running,volume}) {
      if(id!==sessionId){sessionId=id;spoken.clear();audio.pause();speaking=false;}
      audio.volume=volume;
      if(!running){audio.pause();return;}
      // A jump (seek, restart, coming back to the page) skips cues that are already behind us.
      if(Math.abs(time-lastTime)>2){
        spoken.clear();audio.pause();speaking=false;
        cues.forEach((cue,i)=>{if(cue.at<time-1)spoken.add(i);});
      }
      lastTime=time;
      if(speaking&&audio.paused&&!audio.ended)audio.play().catch(()=>{});
      const upcoming=cues.map((cue,i)=>i).filter(i=>!spoken.has(i));
      upcoming.slice(0,2).forEach(i=>clip(cues[i].text).catch(()=>{}));
      const due=upcoming.find(i=>cues[i].at<=time);
      if(due===undefined||speaking)return;
      spoken.add(due);speaking=true;
      clip(cues[due].text).then(url=>{audio.src=url;return audio.play();})
        .catch(()=>{speaking=false;console.warn('Meditation voice is not available right now.');});
    }
  };
})();

  <script data-source="voice.js">
/* Speech stays in memory until the user finishes or cancels the capture. */
(() => {
  window.createVoiceCapture=function({onState,onComplete,onError}) {
    let current=null;
    const state=()=>current?{active:true,phase:current.phase,surface:current.surface,submit:current.submit}:{active:false,phase:'idle',surface:'',submit:false};
    const notify=()=>onState(state());
    const transcript=s=>[...s.parts,...s.results.map(r=>r.text)].filter(Boolean).join(' ').trim();
    function release(s,abort=false) {
      if(current!==s)return;
      current=null;clearTimeout(s.restartTimer);clearTimeout(s.finishTimer);
      if(abort&&s.engine){try{s.engine.abort();}catch(_){}}
      s.engine=null;notify();
    }
    function fail(s,message) {
      if(current!==s)return;
      const text=transcript(s),base=s.base;
      release(s,true);onError(message,text?[base,text].filter(Boolean).join(' '):null);
    }
    function complete(s) {
      if(current!==s)return;
      const text=transcript(s),result={text,base:s.base,submit:s.submit,surface:s.surface};
      release(s);
      if(text)onComplete(result);else onError('No speech detected. Click the microphone to try again.',null);
    }
    function stopEngine(s) {
      if(!s.engine||!s.started)return;
      try{s.engine.stop();}catch(_){fail(s,'Voice input could not finish. Your words are saved as a draft.');}
    }
    function connect(s) {
      if(current!==s||s.phase==='finishing')return;
      const Speech=window.Articul8SpeechEngine||window.SpeechRecognition||window.webkitSpeechRecognition;
      let engine;
      try{engine=new Speech();}catch(_){fail(s,'Voice input is unavailable in this browser.');return;}
      s.engine=engine;s.results=[];s.started=false;s.phase='connecting';notify();
      engine.lang=navigator.language||'en-US';
      engine.continuous=true;engine.interimResults=true;
      const live=()=>current===s&&s.engine===engine;
      engine.onstart=()=>{
        if(!live())return;s.started=true;
        if(s.phase==='finishing'){stopEngine(s);return;}
        s.phase='listening';notify();
      };
      engine.onresult=event=>{
        if(!live())return;
        // Each event is a cumulative snapshot; replace results to avoid duplicates.
        s.results=Array.from(event.results,result=>({text:result[0]?.transcript?.trim()||'',final:result.isFinal}));
      };
      engine.onerror=event=>{
        if(!live()||event.error==='no-speech')return;
        const messages={
          'not-allowed':'Allow microphone access to use voice input.',
          'service-not-allowed':'Voice input is unavailable in this browser.',
          'audio-capture':'No microphone is available.',
          'network':'Voice input could not connect. Try again.',
          'aborted':'Voice input was interrupted.',
          'language-not-supported':'Voice input does not support the selected browser language.'
        };
        fail(s,messages[event.error]||'Voice input stopped. Try again.');
      };
      engine.onend=()=>{
        if(!live())return;
        const segment=s.results.map(r=>r.text).filter(Boolean).join(' ').trim();
        if(segment)s.parts.push(segment);
        s.results=[];s.engine=null;s.started=false;
        if(s.phase==='finishing'){complete(s);return;}
        // Some engines end after a pause. Continue the same capture without sending.
        s.emptyEnds=segment?0:s.emptyEnds+1;
        if(s.emptyEnds>=3){s.phase='paused';notify();return;}
        s.phase='connecting';notify();
        s.restartTimer=setTimeout(()=>connect(s),350);
      };
      try{engine.start();}catch(_){fail(s,'Voice input could not start. Try again.');}
    }
    return {
      get active(){return !!current;},
      get surface(){return current?.surface||'';},
      get phase(){return current?.phase||'idle';},
      get submit(){return current?.submit===true;},
      start({surface='agent',submit=true,base=''}={}) {
        if(current)return;
        if(!(window.Articul8SpeechEngine||window.SpeechRecognition||window.webkitSpeechRecognition)){onError('Voice input is unavailable in this browser.',null);return;}
        current={surface,submit,base:base.trimEnd(),phase:'connecting',parts:[],results:[],engine:null,started:false,emptyEnds:0,restartTimer:null,finishTimer:null};
        connect(current);
      },
      finish({submit=current?.submit,surface=current?.surface}={}) {
        const s=current;if(!s||s.phase==='finishing')return;
        s.submit=submit;s.surface=surface;s.phase='finishing';clearTimeout(s.restartTimer);notify();
        if(!s.engine){complete(s);return;}
        s.finishTimer=setTimeout(()=>fail(s,'Voice input took too long. Your words are saved as a draft.'),8000);
        // stop() yields its last result asynchronously; onend submits exactly once.
        stopEngine(s);
      },
      cancel(){if(current)release(current,true);}
    };
  };
})();

  <script data-source="home.js">
const agent = document.getElementById('agent');
const toggle = document.getElementById('ai-toggle');
const notice = document.getElementById('notice');
let noticeTimer;
function announce(message) {
  notice.textContent=message;
  notice.hidden=false;
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>{notice.hidden=true;},4200);
}
let agentReturnFocus;
function setAgent(open, focusInput=true) {
  if(open&&!document.querySelector('.workspace').hidden){
    if(focusInput)document.querySelector('#main-composer textarea').focus();
    return;
  }
  if (open && agent.hidden) agentReturnFocus=document.activeElement;
  if (!open) window.dispatchEvent(new CustomEvent('articul8:stop-voice',{detail:{surface:'agent'}}));
  agent.hidden=!open;
  toggle.setAttribute('aria-expanded',String(open));
  toggle.setAttribute('aria-label',open?'Close Concentr8 Agent':'Open Concentr8 Agent');
  if (open) window.dispatchEvent(new CustomEvent('articul8:agent-open'));
  if (open && focusInput) agent.querySelector('textarea').focus();
  if (!open && agent.contains(document.activeElement)) {
    const target=agentReturnFocus && agentReturnFocus.isConnected && agentReturnFocus.getClientRects().length ? agentReturnFocus : toggle;
    target.focus();
  }
}

(() => {
  const store=window.Articul8;
  const app=document.querySelector('.app');
  const sidebar=document.getElementById('sidebar');
  const checkIn=document.querySelector('.check-in');
  const mainForm=document.getElementById('main-composer');

  document.getElementById('agent-composer-mount').replaceWith(agentForm);
  const forms=[mainForm,agentForm];
  const inputs=forms.map(form=>form.querySelector('textarea'));
  const conversations=[document.getElementById('home-conversation'),document.getElementById('agent-conversation')];
  const renderedConversations=new WeakMap();
  const homeScroll=document.getElementById('home-chat-scroll');
  const chatScrollers=[ChatScroll.create(homeScroll,conversations[0]),ChatScroll.create(conversations[1])];
  const contexts=forms.map(form=>{const context=document.createElement('div');context.className='chat-context';context.hidden=true;if(form===mainForm)form.before(context);else agent.querySelector('header').after(context);return context;});
  const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let storageNoticeShown=false;
  const voicePane=document.createElement('div');
  voicePane.className='voice-pane';voicePane.hidden=true;
  voicePane.innerHTML='<button class="voice-finish" type="button" aria-label="Finish and send voice message"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button><p class="voice-message" role="status" aria-live="polite"></p><p class="voice-hint"></p>';
  agent.querySelector('header').after(voicePane);
  const voiceFinish=voicePane.querySelector('.voice-finish');
  const voiceCapture=createVoiceCapture({
    onState:renderVoice,
    onComplete:({text,base,submit,surface})=>{
      const message=[base,text].filter(Boolean).join(' ');
      if(submit&&!window.Concentr8?.isAsking()){store.send(message);window.Concentr8?.ask();}else store.setDraft(message);
      (surface==='agent'?agentForm:mainForm).querySelector('textarea').focus();
    },
    onError:(message,draft)=>{
      if(draft)store.setDraft(draft);

      if(!agent.hidden)agentForm.querySelector('textarea').focus();

  });
  function renderVoice(state) {
    const wasActive=agent.classList.contains('voice-active');
    const inAgent=state.active&&state.surface==='agent';
    const status={connecting:'Connecting…',listening:'Listening…',finishing:'Finishing…',paused:'Listening stopped'}[state.phase]||'';
    agent.classList.toggle('voice-active',inAgent);agent.dataset.voicePhase=state.phase;

    voicePane.querySelector('.voice-message').textContent=inAgent?status:'';

  }

  function sizeInput(input) {
    if (!input.getClientRects().length) return;
    input.style.height='32px';
    input.style.height=Math.min(116,Math.max(32,input.scrollHeight))+'px';
  }
  function renderDraft() {
    inputs.forEach(input=>{
      if(input.value!==store.state.draft) input.value=store.state.draft;
      sizeInput(input);
      input.form.querySelector('[type="submit"]').disabled=voiceCapture.active||window.Concentr8?.isAsking()||!input.value.trim();
    });
    chatScrollers.forEach(scroller=>scroller.schedule());
  }
  function renderSidebar() {
    const collapsed=store.state.collapsed;
    app.classList.toggle('sidebar-collapsed',collapsed);
    sidebar.inert=collapsed;
    document.getElementById('open-sidebar').hidden=!collapsed;
    document.getElementById('collapse-sidebar').setAttribute('aria-expanded',String(!collapsed));
    inputs.forEach(sizeInput);
    chatScrollers.forEach(scroller=>scroller.schedule());
  }
  /* AI-GENERATED: chat look and actions (docs/plans/home-chat-tools.md, ADR 0027). The student's messages are dark bubbles, answers of Concentr8 are plain text with small action buttons below. */
  function pendingAction() {
    for(let i=store.state.messages.length-1;i>=0;i--){
      const index=(store.state.messages[i].actions||[]).findIndex(a=>a.state==='pending');
      if(index>=0)return {messageId:store.state.messages[i].id,index};
    }
    return null;
  }
  function actionMarkup(message,next) {
    const id=escapeHtml(message.id);
    const parts=(message.actions||[]).map((action,index)=>{
      const title=escapeHtml(action.title||'');
      if(action.type==='open_tool'){
        const tool=Product.tool(action.tool);
        if(!tool)return '';
        return `<div class="chat-tool"><span class="chat-tool-icon">${Product.icon(Product.paths[tool.icon]||'',18)}</span><span class="chat-tool-name">${escapeHtml(tool.name)}</span><button type="button" class="chat-action solid" data-chat-tool="${escapeHtml(action.tool)}">Open</button></div>`;
      }
      if(action.state==='done'&&action.type==='suggest_calendar')return `<p class="chat-note">Added to calendar: ${title}</p>`;
      const minutesText=(action.minutes?` (${Number(action.minutes)} min)`:'')+(action.due?` · due ${escapeHtml(action.due)}`:'');
      if(action.state==='done')return `<p class="chat-note">Added to to-do: ${title}${minutesText}${action.undoable?` · <button type="button" class="chat-undo" data-chat-action="undo" data-message="${id}" data-index="${index}">Undo</button>`:''}</p>`;
      if(action.state==='undone')return `<p class="chat-note">Removed from to-do: ${title}</p>`;
      if(action.state!=='pending')return '';
      const label=action.type==='suggest_calendar'?`+ Calendar: ${escapeHtml(CalendarUI.timeLabel({kind:'plan',allDay:false,start:action.start,end:action.end}))}`:`+ To-do: ${title}${minutesText}`;
      const hint=next&&next.messageId===message.id&&next.index===index?'<kbd aria-hidden="true">\u21b5</kbd>':'';
      return `<button type="button" class="chat-action" data-chat-action="accept" data-message="${id}" data-index="${index}" title="${title}">${label}${hint}</button>`;
    });
    const buttons=parts.filter(x=>x.startsWith('<button'));
    const rest=parts.filter(x=>!x.startsWith('<button'));
    const dismiss=buttons.length?`<button type="button" class="chat-action quiet" data-chat-action="dismiss" data-message="${id}">Not now</button>`:'';
    return rest.join('')+(buttons.length?`<div class="chat-actions">${buttons.join('')}${dismiss}</div>`:'');
  }
  function renderMessages() {
    const next=pendingAction();
    let html=store.state.messages.map(message=>{
      if(message.role==='assistant')return `<article class="chat-message agent-message" aria-label="Concentr8"><p>${escapeHtml(message.text)}</p>${actionMarkup(message,next)}</article>`;
      const calendar=message.contextId||message.eventId||message.proposal?CalendarUI.messageMarkup(message):'';
      return `<article class="chat-message user-message"><p>${escapeHtml(message.text)}</p>${calendar?`<div class="message-actions">${calendar}</div>`:''}</article>`;
    }).join('');
    if(window.Concentr8?.isAsking())html+='<p class="chat-pending" role="status">Concentr8 is thinking…</p>';
    conversations.forEach((log,index)=>{
      // Usage/stat updates must not interrupt someone reading an older reply.
      // Compare source markup: innerHTML normalizes escaped quotes on readback.
      const previous=renderedConversations.get(log);
      if(previous?.html!==html||previous?.chatId!==store.state.activeChatId){
        log.innerHTML=html;log.dataset.chatId=store.state.activeChatId;
        renderedConversations.set(log,{html,chatId:store.state.activeChatId});
        chatScrollers[index].schedule(true);
      }
    });
    const chat=store.state.chats.find(c=>c.id===store.state.activeChatId);
    document.getElementById('focus-chat-actions').hidden=chat?.mode!=='focus'||store.state.messages.filter(m=>m.role!=='assistant').length<2||window.Concentr8?.isAsking();
    checkIn.classList.toggle('has-messages',store.state.messages.length>0);
    homeScroll.hidden=store.state.messages.length===0;
  }
  const greetingTitle=document.getElementById('check-in-title');
  function renderGreeting() {
    const hour=new Date().getHours();
    const word=hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
    const name=store.state.profile.name.trim();
    const chat=store.state.chats.find(c=>c.id===store.state.activeChatId);
    greetingTitle.textContent=store.state.messages.length?ChatHistory.title(chat):(name?word+', '+name:word);
  }
  function renderContext() {
    const event=store.state.calendarEvents.find(e=>e.id===store.state.agentEventId);
    contexts.forEach(context=>{context.hidden=!event;context.innerHTML=event?`<button type="button" data-open-context><span>${escapeHtml(event.title)}</span><span>${escapeHtml(CalendarUI.timeLabel(event))}</span></button><button class="icon-button" type="button" data-clear-context aria-label="Clear selected event">×</button>`:'';});
    chatScrollers.forEach(scroller=>scroller.schedule());
  }
  contexts.forEach(context=>context.addEventListener('click',event=>{if(event.target.closest('[data-clear-context]'))store.setAgentEvent(null);else if(event.target.closest('[data-open-context]'))CalendarUI.details(store.state.agentEventId);}));
  const historyPanel=document.getElementById('chat-history');
  const historyToggle=document.getElementById('chat-history-toggle');
  const historySearch=document.getElementById('chat-history-search');
  function renderHistory(){
    const current=store.state.chats.find(c=>c.id===store.state.activeChatId);
    const label=current?.messages.length?ChatHistory.title(current):'New chat';
    document.getElementById('chat-switcher-title').textContent=label;
    historyToggle.title=label;
    if(historyPanel.hidden)return;
    const query=historySearch.value.trim().toLowerCase();
    const chats=store.state.chats.filter(c=>(c.messages.length||c.draft.trim())&&(!query||[ChatHistory.title(c),...c.messages.map(m=>m.text)].join(' ').toLowerCase().includes(query))).sort((a,b)=>b.updatedAt-a.updatedAt);
    document.getElementById('chat-search-wrap').hidden=store.state.chats.filter(c=>c.messages.length||c.draft.trim()).length<6;
    const now=new Date(),yesterday=new Date(now);yesterday.setDate(yesterday.getDate()-1);
    let previousGroup='';
    document.getElementById('chat-history-list').innerHTML=chats.map(chat=>{
      const date=new Date(chat.updatedAt),group=date.toDateString()===now.toDateString()?'Today':date.toDateString()===yesterday.toDateString()?'Yesterday':'Earlier';
      const heading=group!==previousGroup?`<h3 class="chat-history-group">${group}</h3>`:'';previousGroup=group;
      const time=now-date<60000?'just now':group==='Today'?date.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):date.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      return heading+`<button type="button" class="chat-history-row" data-chat-id="${escapeHtml(chat.id)}" title="${escapeHtml(ChatHistory.title(chat))}" ${chat.id===store.state.activeChatId?'aria-current="true"':''}><strong>${escapeHtml(ChatHistory.title(chat))}</strong><span class="chat-history-meta">${chat.id===store.state.activeChatId?'<span>Current</span>':''}<span>${chat.draft?'Draft':escapeHtml(time)}</span></span></button>`;
    }).join('')||`<p class="detail-empty">${query?'No matching chats.':'No chats yet.'}</p>`;
  }
  function setHistory(open){
    historyPanel.hidden=!open;
    historyToggle.setAttribute('aria-expanded',String(open));
    if(open){historySearch.value='';renderHistory();document.getElementById('new-chat').focus();}
    else if(historyPanel.contains(document.activeElement))historyToggle.focus();
  }
  historyToggle.addEventListener('click',()=>setHistory(historyPanel.hidden));
  historySearch.addEventListener('input',renderHistory);
  historyPanel.addEventListener('click',event=>{
    const button=event.target.closest('[data-chat-id]');
    if(!button)return;
    voiceCapture.cancel();store.selectChat(button.dataset.chatId);setHistory(false);inputs[0].focus();
  });
  document.addEventListener('click',event=>{
    if(!historyPanel.hidden&&!historyPanel.contains(event.target)&&!historyToggle.contains(event.target))setHistory(false);
  });
  document.getElementById('new-chat').addEventListener('click',()=>{
    voiceCapture.cancel();store.newChat();setHistory(false);inputs[0].focus();
  });
  document.getElementById('quick-start').addEventListener('click',()=>{
    voiceCapture.cancel();store.newChat('focus');setHistory(false);
    store.send('Help me plan a focus session.');window.Concentr8?.ask();inputs[0].focus();
  });
  document.getElementById('chat-start-focus').addEventListener('click',()=>FocusUI.setup({taskId:store.state.activeTaskId||undefined,origin:'Home',selected:['timer']}));

  /* Profile picture (Jonas, 6725807): shrunk to 128 px in the browser and kept with the other profile data; it never leaves this device. */
  document.addEventListener('change',event=>{
    const input=event.target.closest?.('[data-avatar-file]');if(!input||!input.files[0])return;
    const file=input.files[0],note=document.querySelector('[data-avatar-note]'),fail=text=>{if(note)note.textContent=text;};
    if(file.size>8000000){fail('Pick a picture under 8 MB.');return;}
    const url=URL.createObjectURL(file),img=new Image();
    img.onerror=()=>{URL.revokeObjectURL(url);fail('That file could not be read as a picture.');};
    img.onload=()=>{
      const size=128,side=Math.min(img.width,img.height),canvas=document.createElement('canvas');canvas.width=canvas.height=size;
      canvas.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,size,size);URL.revokeObjectURL(url);
      Articul8.change(s=>{s.profile.avatar=canvas.toDataURL('image/jpeg',.85);},'profile');
      window.dispatchEvent(new CustomEvent('articul8:rerender'));
    };
    img.src=url;
  });
  document.addEventListener('click',event=>{if(event.target.closest('[data-avatar-remove]')){Articul8.change(s=>{s.profile.avatar='';},'profile');window.dispatchEvent(new CustomEvent('articul8:rerender'));}});
  window.addEventListener('concentr8:chat-pending',()=>{renderDraft();renderMessages();});
  window.addEventListener('articul8:navigate',event=>{setHistory(false);if(event.detail.page==='Home')chatScrollers[0].schedule(true);});
  const profileButton=document.querySelector('.sidebar .profile');
  function renderProfileButton() {
    const p=store.state.profile,mark=p.avatar?'<span class="avatar"><img src="'+escapeHtml(p.avatar)+'" alt=""></span>':'<span class="avatar">'+escapeHtml((p.name||'Y').slice(0,1).toUpperCase())+'</span>';
    profileButton.innerHTML=mark+'<span>Profile</span>';
  }
  function renderAll() { renderDraft();renderGreeting();renderSidebar();renderMessages();renderContext();renderHistory();renderProfileButton(); }
  window.addEventListener('articul8:change',event=>{
    const {reason,persisted}=event.detail;
    if(!persisted&&!storageNoticeShown){announce('Changes are saved for this session only.');storageNoticeShown=true;}
    if(reason==='draft')renderDraft();
    else if(reason==='sidebar')renderSidebar();
    else if(reason==='tasks'){renderMessages();}
    else renderAll();
  });
  window.addEventListener('articul8:agent-open',()=>{renderDraft();chatScrollers[1].schedule(true);});
  document.fonts.ready.then(()=>chatScrollers.forEach(scroller=>scroller.schedule()));
  document.getElementById('collapse-sidebar').addEventListener('click',()=>{store.setCollapsed(true);document.getElementById('open-sidebar').focus();});
  document.getElementById('open-sidebar').addEventListener('click',()=>{store.setCollapsed(false);document.getElementById('collapse-sidebar').focus();});
  toggle.addEventListener('click',()=>{setAgent(agent.hidden);renderDraft();});
  document.getElementById('close-agent').addEventListener('click',()=>setAgent(false));
  forms.forEach(form=>{
    const input=form.querySelector('textarea');
    input.addEventListener('input',()=>{
      if(voiceCapture.active)voiceCapture.cancel();
      store.setDraft(input.value);
    });
    input.addEventListener('keydown',event=>{
      if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){
        event.preventDefault();
        const next=input.value.trim()?null:pendingAction();
        if(next)store.runAction(next.messageId,next.index,'accept');else form.requestSubmit();
      }
    });
    form.addEventListener('submit',event=>{
      event.preventDefault();
      if(voiceCapture.active){voiceCapture.finish({submit:true});return;}
      if(window.Concentr8?.isAsking()){input.focus();return;}
      const text=input.value.trim();
      if(!text){input.focus();return;}
      voiceCapture.cancel();
      store.send(text);
      window.Concentr8?.ask();
      input.focus();
    });
  });
  conversations.forEach(log=>log.addEventListener('click',event=>{
    const toolButton=event.target.closest('[data-chat-tool]');
    if(toolButton){Product.go('Toolbox',toolButton.dataset.chatTool);return;}
    const actionButton=event.target.closest('[data-chat-action]');
    if(actionButton){store.runAction(actionButton.dataset.message,Number(actionButton.dataset.index),actionButton.dataset.chatAction);return;}
    const calendarButton=event.target.closest('[data-cal-message]');
    if(calendarButton)CalendarUI.messageAction(calendarButton);
  }));
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&!document.querySelector('dialog[open]')){voiceCapture.cancel();setAgent(false);notice.hidden=true;setHistory(false);}
  });
  voiceFinish.addEventListener('click',()=>voiceCapture.finish());
  document.querySelectorAll('[data-voice]').forEach(button=>button.addEventListener('click',()=>{
    if(voiceCapture.active){voiceCapture.finish();return;}
    notice.hidden=true;voiceCapture.start({surface:button.dataset.voice,submit:false,base:store.state.draft});
  }));
  window.addEventListener('articul8:stop-voice',event=>{if(!event.detail?.surface||event.detail.surface===voiceCapture.surface)voiceCapture.cancel();});
  window.addEventListener('articul8:navigate',()=>voiceCapture.cancel());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)voiceCapture.cancel();});
  window.addEventListener('pagehide',()=>voiceCapture.cancel());
  window.addEventListener('resize',()=>inputs.forEach(sizeInput));
  renderAll();
})();

(() => {

  const icon=(name,size=24)=>P.icon(icons[name]||P.paths[name],size);
  const button=(attr,label,name,extra='')=>`<button class="icon-button" type="button" ${attr} aria-label="${E(label)}" title="${E(label)}" ${extra}>${icon(name)}</button>`;
  function heading(title,actions='',backPage='Toolbox',backPath='') {return `<div class="detail-heading"><button class="text-back" type="button" data-detail-back="${E(backPage)}" data-back-path="${E(backPath)}">${icon('back')}Back</button><h1>${E(title)}</h1>${actions?`<div class="detail-actions">${actions}</div>`:''}</div>`;}
  const redraw=()=>window.dispatchEvent(new CustomEvent('articul8:rerender'));
  const searchIcon=()=>icon('search');
  const active=()=>location.hash.startsWith('#toolbox');
  const format=seconds=>{seconds=Math.max(0,Math.ceil(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');};

  function checklist(){return '<div class="product-heading"><h1>To Do List</h1><button class="wire-button" type="button" data-tool-new-task>New task</button></div>'+`<section class="checklist-editor"><div class="checklist-rows">${S.state.tasks.map(t=>`<div class="check-row ${t.done?'done':''}"><input type="checkbox" data-list-check="${E(t.id)}" aria-label="Complete ${E(t.title)}" ${t.done?'checked':''}><textarea class="check-title" data-list-title="${E(t.id)}" aria-label="Edit ${E(t.title)}" rows="1" maxlength="2000" enterkeyhint="done">${E(t.title)}</textarea><span class="check-due">${[P.due(t.id)?E(P.dateLabel(P.due(t.id).start)):'',t.estimatedMinutes?Number(t.estimatedMinutes)+' min':''].filter(Boolean).join(' · ')}</span>${button(`data-list-delete="${E(t.id)}"`,'Delete '+t.title,'trash')}</div>`).join('')||'<p class="detail-empty">No tasks yet.</p>'}</div><form class="check-add" id="check-add"><input aria-label="New to-do" placeholder="Add a to-do" maxlength="2000" required><button class="wire-button" type="submit">Add</button></form></section>`;}
  function fitListTitle(field){
    field.style.height='auto';
    field.style.height=(field.scrollHeight+field.offsetHeight-field.clientHeight)+'px';
  }
  let checklistObserver=null;
  function mountChecklist(){
    checklistObserver?.disconnect();
    const list=document.querySelector('.checklist-rows');
    if(!list)return;
    const fit=()=>list.querySelectorAll('[data-list-title]').forEach(fitListTitle);
    fit();
    let width=list.clientWidth;
    checklistObserver=new ResizeObserver(()=>{
      if(list.clientWidth!==width){width=list.clientWidth;fit();}
    });
    checklistObserver.observe(list);
  }
  document.fonts?.ready.then(()=>document.querySelectorAll('[data-list-title]').forEach(fitListTitle));
  function removeTask(id){S.change(s=>{const eventIds=s.calendarEvents.filter(e=>e.taskId===id).map(e=>e.id);s.tasks=s.tasks.filter(t=>t.id!==id);s.calendarEvents=s.calendarEvents.filter(e=>e.taskId!==id);s.messages.forEach(m=>{if(m.taskId===id)m.taskId=null;if(eventIds.includes(m.eventId))m.eventId=null;if(eventIds.includes(m.contextId))m.contextId=null;});if(s.activeTaskId===id)s.activeTaskId=null;if(eventIds.includes(s.agentEventId))s.agentEventId=null;},'tasks');}

  const appNames=['Steam','Twitch','Discord','Epic Games','YouTube','TikTok','Instagram','Reddit','X','Facebook','Slack','Microsoft Teams','WhatsApp','Netflix'];
  const presets=[{name:'Games',apps:['Steam','Twitch','Discord']},{name:'Social media',apps:['Instagram','TikTok','Reddit','X']},{name:'Entertainment',apps:['YouTube','Netflix','Twitch']},{name:'Quiet work',apps:['Slack','Microsoft Teams','WhatsApp']}];
  let appQuery='';
  const addApps=names=>S.change(s=>{for(const name of names){const value=name.trim().slice(0,120);if(value&&!s.tools.blockedApps.some(a=>a.toLowerCase()===value.toLowerCase()))s.tools.blockedApps.push(value);}},'tools');
  function candidates(){const items=appQuery.trim()?appNames.filter(n=>n.toLowerCase().includes(appQuery.toLowerCase())&&!S.state.tools.blockedApps.some(a=>a.toLowerCase()===n.toLowerCase())):[];return items.map(n=>`<button class="wire-button" type="button" data-add-block="${E(n)}">${E(n)} ${icon('plus',17)}</button>`).join('');}
  /* AI-GENERATED: the hints panel (concentr8-blocker.js) has no wireframe from Jack. */
  function block(){return heading('Block App')+(window.Concentr8Blocker?window.Concentr8Blocker.panel():'')+`<h2 class="block-prompt">Apps to block</h2><form class="detail-search" id="block-search">${searchIcon()}<input aria-label="Search apps to block" placeholder="Search or add an app" maxlength="120" value="${E(appQuery)}" autocomplete="off" required><button class="wire-button" type="submit">Add</button></form><div class="app-candidates">${candidates()}</div><div class="block-layout"><section class="detail-section block-list-section"><h2>Block list</h2><div class="blocked-list">${S.state.tools.blockedApps.map((n,i)=>`<span class="blocked-app">${E(n)}${button(`data-block-remove="${i}"`,'Remove '+n,'close')}</span>`).join('')||'<span class="detail-note">No apps added.</span>'}</div></section><section class="detail-section block-preset-section"><h2>Presets</h2><div class="preset-grid">${presets.map((p,i)=>{const all=p.apps.every(n=>S.state.tools.blockedApps.some(a=>a.toLowerCase()===n.toLowerCase()));return `<article class="block-preset"><h3>${p.name}</h3><p>${p.apps.join(' · ')}</p><button type="button" class="wire-button" data-block-preset="${i}" ${all?'disabled':''}>${all?'Added':'Add preset'}</button></article>`;}).join('')}</div></section></div>`;}

  const mixes=[{id:'nature',name:'Nature',art:'M10 80Q45 40 80 80T150 80M10 100Q45 60 80 100T150 100M10 120Q45 80 80 120T150 120'},{id:'piano',name:'Ambient Piano',art:'M20 30h120v100H20V30Zm20 0v100m20-100v100m20-100v100m20-100v100m20-100v100M35 30v55m20-55v55m40-55v55m20-55v55'},{id:'electronic',name:'Soft Electronic',art:'M20 80h20l10-35 20 70 20-70 20 70 10-35h20'},{id:'acoustic',name:'Acoustic',art:'M20 120Q80-20 140 120M35 120Q80 10 125 120M50 120Q80 40 110 120M65 120Q80 70 95 120'}];
  const mixTracks=[[{title:'Rain and Pads',url:'music/nature-1.mp3'}],[{title:'Felt Piano',url:'music/ambient-piano-1.mp3'}],[{title:'Soft Pulse',url:'music/soft-electronic-1.mp3'}],[{title:'Warm Guitar',url:'music/acoustic-1.mp3'}]];
  let mixIndex=0,trackIndex=0,trackLists=mixTracks.map(list=>list.map(t=>({title:t.title,artist:'Concentr8',url:t.url}))),musicMessage='',volumeOpen=false,samplePlaying=false;
  const audio=new Audio();audio.preload='metadata';audio.volume=.45;
  const track=()=>trackLists[mixIndex][trackIndex];
  const musicPlaying=()=>track()?.url?!audio.paused:samplePlaying;
  const pauseMusic=()=>{samplePlaying=false;audio.pause();paintMusic();};
  function paintMusic(){const root=document.querySelector('.music-player');if(!root)return;const t=track();root.querySelector('[data-track-title]').textContent=t.title;root.querySelector('[data-track-artist]').textContent=t.artist||'Local audio';const play=root.querySelector('[data-music-play]');play.disabled=false;play.innerHTML=icon(musicPlaying()?'pause':'play');play.setAttribute('aria-label',musicPlaying()?'Pause music':'Play music');root.querySelectorAll('[data-music-skip]').forEach(b=>b.disabled=trackLists[mixIndex].length<2);root.querySelector('[data-volume-toggle]').innerHTML=icon(audio.muted?'muted':'volume');const status=document.querySelector('.music-status');if(status){status.textContent=musicMessage;status.hidden=!musicMessage;}}
  function loadTrack(play=false){samplePlaying=false;audio.pause();musicMessage='';const t=track();if(t?.url){audio.src=t.url;if(play)audio.play().catch(()=>{musicMessage='Audio could not play.';paintMusic();});}else{audio.removeAttribute('src');audio.load();samplePlaying=play;}paintMusic();}
  function music(){return heading('Music')+`<div class="music-gallery">${mixes.map((m,i)=>`<article class="ambient-card"><button class="ambient-select" type="button" data-mix="${i}" aria-pressed="${i===mixIndex}"><div class="ambient-art"><svg viewBox="0 0 160 160" aria-hidden="true"><path d="${m.art}"/></svg></div><span>${m.name}</span></button><div class="ambient-import"><span>${E(trackLists[i][0].title)}</span><label class="audio-import-label">Add audio<input type="file" accept="audio/*" multiple data-audio-import="${i}" aria-label="Add audio to ${m.name}"></label></div></article>`).join('')}</div><div class="player-bar music-player"><div class="player-track"><strong data-track-title>${E(track().title)}</strong><span data-track-artist>${E(track().artist||'Local audio')}</span></div><div class="player-controls">${button('data-music-skip="-1"','Previous track','previous',trackLists[mixIndex].length<2?'disabled':'')}<button type="button" class="icon-button player-primary" data-music-play aria-label="${musicPlaying()?'Pause':'Play'} music">${icon(musicPlaying()?'pause':'play')}</button>${button('data-music-skip="1"','Next track','next',trackLists[mixIndex].length<2?'disabled':'')}</div><div class="player-volume">${button('data-volume-toggle','Volume',audio.muted?'muted':'volume',`aria-expanded="${volumeOpen}"`)}<input type="range" min="0" max="100" value="${audio.volume*100}" aria-label="Music volume" data-music-volume ${volumeOpen?'':'hidden'}></div></div><p class="music-status" ${musicMessage?'':'hidden'}>${E(musicMessage)}</p>`;}
  audio.addEventListener('play',paintMusic);audio.addEventListener('pause',paintMusic);audio.addEventListener('error',()=>{if(track()?.url){musicMessage='This audio format could not be played.';paintMusic();}});audio.addEventListener('ended',()=>{if(trackLists[mixIndex].length>1){trackIndex=(trackIndex+1)%trackLists[mixIndex].length;loadTrack(true);}else paintMusic();});

  let timerSeconds=Number.isFinite(Number(S.state.tools.timerSeconds))?Math.max(0,Math.min(86399,Math.floor(Number(S.state.tools.timerSeconds)))):1500;
  function timer(){return heading('Timer')+`<section class="timer-picker-page"><div class="time-wheels">${[['Hours',24,Math.floor(timerSeconds/3600),'hr'],['Minutes',60,Math.floor(timerSeconds%3600/60),'min'],['Seconds',60,timerSeconds%60,'sec']].map(([name,max,value,label])=>`<div class="wheel-column"><div class="time-wheel" data-time-wheel="${name.toLowerCase()}" role="listbox" aria-label="${name}" tabindex="0">${Array.from({length:max},(_,i)=>`<button type="button" role="option" tabindex="-1" data-wheel-value="${i}" aria-selected="${i===value}">${String(i).padStart(2,'0')}</button>`).join('')}</div><span>${label}</span></div>`).join('')}</div><div class="timer-total" data-timer-total>${format(timerSeconds)}</div><button type="button" class="wire-button solid" data-timer-start ${!timerSeconds?'disabled':''}>Start</button></section>`;}
  function mountWheels(){const wheels=[...document.querySelectorAll('[data-time-wheel]')];if(!wheels.length)return;const vals=[Math.floor(timerSeconds/3600),Math.floor(timerSeconds%3600/60),timerSeconds%60];wheels.forEach((wheel,i)=>{wheel.scrollTop=vals[i]*44;let debounce;const update=()=>{const value=Math.max(0,Math.min(wheel.children.length-1,Math.round(wheel.scrollTop/44)));vals[i]=value;wheel.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected',String(j===value)));timerSeconds=vals[0]*3600+vals[1]*60+vals[2];const total=document.querySelector('[data-timer-total]'),start=document.querySelector('[data-timer-start]');if(total)total.textContent=format(timerSeconds);if(start)start.disabled=!timerSeconds;S.change(s=>s.tools.timerSeconds=timerSeconds,'tool-setting');};wheel.addEventListener('scroll',()=>{clearTimeout(debounce);debounce=setTimeout(update,90);},{passive:true});wheel.addEventListener('click',e=>{const option=e.target.closest('[data-wheel-value]');if(option){wheel.scrollTop=Number(option.dataset.wheelValue)*44;update();}});wheel.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown','Home','End'].includes(e.key))return;e.preventDefault();const current=Math.round(wheel.scrollTop/44),next=e.key==='Home'?0:e.key==='End'?wheel.children.length-1:current+(e.key==='ArrowDown'?1:-1);wheel.scrollTop=Math.max(0,Math.min(wheel.children.length-1,next))*44;update();});});}
  function timerSession(a){return heading('Timer',`<button class="wire-button" type="button" data-focus-end>End session</button>`,'Toolbox','timer')+`<div class="solo-timer"><div class="timer-dial solo-timer-dial"><svg viewBox="0 0 300 300" aria-hidden="true"><circle class="timer-track" cx="150" cy="150" r="138"/><circle class="timer-progress" data-clockwise-ring cx="150" cy="150" r="138"/></svg><div class="timer-value" data-timer-value>00:00</div></div><div class="timer-controls"><button class="round-control" type="button" data-focus-pause aria-label="${a.status==='running'?'Pause timer':'Resume timer'}">${icon(a.status==='running'?'pause':'play',32)}</button></div></div>`;}
  let rest=null;
  function startBreak(){rest={duration:900,elapsed:0,startedAt:Date.now(),running:true};P.go('Break');}
  function breakPage(){return heading('Break','','Focus')+`<div class="solo-timer"><div class="large-countdown" data-break-time>${format(rest?Math.max(0,rest.duration-rest.elapsed-(rest.running?(Date.now()-rest.startedAt)/1000:0)):900)}</div><div class="timer-controls"><button class="round-control" type="button" data-break-toggle aria-label="${rest?.running?'Pause break':'Start break'}">${icon(rest?.running?'pause':'play',32)}</button><button class="wire-button" type="button" data-break-end>Finish break</button></div></div>`;}
  function render(id){if(id==='body')return BodyRooms.directory();if(id==='music')return music();if(id==='meditation')return Wellness.render();if(id==='meditation-saved')return Wellness.saved();if(id==='block')return block();if(id==='checklist')return checklist();if(id==='timer')return timer();return null;}
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.hasAttribute('data-detail-back'))P.go(b.dataset.detailBack,b.dataset.backPath||'');
    if(b.hasAttribute('data-list-delete'))removeTask(b.dataset.listDelete);
    if(b.hasAttribute('data-add-block')){appQuery='';addApps([b.dataset.addBlock]);}
    if(b.hasAttribute('data-block-preset'))addApps(presets[Number(b.dataset.blockPreset)].apps);
    if(b.hasAttribute('data-mix')){if(Number(b.dataset.mix)!==mixIndex){mixIndex=Number(b.dataset.mix);trackIndex=0;loadTrack(false);}redraw();}
    if(b.hasAttribute('data-music-play')){if(!track().url){samplePlaying=!samplePlaying;paintMusic();}else if(!audio.src)loadTrack(true);else if(audio.paused)audio.play().catch(()=>{musicMessage='Audio could not play.';paintMusic();});else audio.pause();}
    if(b.hasAttribute('data-music-skip')){const list=trackLists[mixIndex],wasPlaying=musicPlaying();if(list.length){trackIndex=(trackIndex+Number(b.dataset.musicSkip)+list.length)%list.length;loadTrack(wasPlaying);}}
    if(b.hasAttribute('data-volume-toggle')){volumeOpen=!volumeOpen;const input=document.querySelector('[data-music-volume]');input.hidden=!volumeOpen;b.setAttribute('aria-expanded',String(volumeOpen));}
    if(b.hasAttribute('data-timer-start')){const wheels=[...document.querySelectorAll('[data-time-wheel]')];if(wheels.length===3)timerSeconds=wheels.reduce((n,w,i)=>n+Math.max(0,Math.min(w.children.length-1,Math.round(w.scrollTop/44)))*[3600,60,1][i],0);if(timerSeconds>0){pauseMusic();Wellness.stop();FocusUI.start({taskId:P.currentTask()?.id,minutes:timerSeconds/60,selected:['timer'],origin:'Toolbox',timerOnly:true});}}
    if(b.hasAttribute('data-break-toggle')){if(!rest)rest={duration:900,elapsed:0,startedAt:Date.now(),running:true};else if(rest.running){rest.elapsed+=(Date.now()-rest.startedAt)/1000;rest.running=false;}else{if(rest.elapsed>=rest.duration)rest.elapsed=0;rest.startedAt=Date.now();rest.running=true;}redraw();}
    if(b.hasAttribute('data-break-end')){rest=null;P.go('Focus');}
  });
  document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-list-title]'))fitListTitle(t);if(t.matches('#block-search input')){appQuery=t.value;document.querySelector('.app-candidates').innerHTML=candidates();}if(t.matches('[data-music-volume]')){audio.volume=Number(t.value)/100;audio.muted=audio.volume===0;paintMusic();}});
  document.addEventListener('change',e=>{const t=e.target;
    if(t.matches('[data-list-check]'))S.completeTask(t.dataset.listCheck,t.checked);
    if(t.matches('[data-list-title]')){const task=S.state.tasks.find(x=>x.id===t.dataset.listTitle);if(task){if(t.value.trim()){S.upsertTask({...task,title:t.value},'checklist-edit');t.value=task.title;t.setAttribute('aria-label','Edit '+task.title);const row=t.closest('.check-row');row.querySelector('[data-list-check]').setAttribute('aria-label','Complete '+task.title);row.querySelector('[data-list-delete]').setAttribute('aria-label','Delete '+task.title);}else t.value=task.title;fitListTitle(t);}}
    if(t.matches('[data-audio-import]')){const i=Number(t.dataset.audioImport),files=[...t.files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|aac|flac)$/i.test(f.name));if(files.length){if(trackLists[i].every(t=>!t.url))trackLists[i]=[];for(const f of files)trackLists[i].push({title:f.name.replace(/\.[^.]+$/,''),artist:'Local audio',url:URL.createObjectURL(f)});mixIndex=i;trackIndex=0;loadTrack(false);redraw();}}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.matches('[data-list-title]')){e.preventDefault();e.target.blur();}});
  document.addEventListener('submit',e=>{const f=e.target;if(f.id==='check-add'){e.preventDefault();const input=f.querySelector('input');if(input.value.trim()){S.addTask(input.value);document.querySelector('#check-add input')?.focus();}}if(f.id==='block-search'){e.preventDefault();const value=f.querySelector('input').value;appQuery='';addApps([value]);}});
  setInterval(()=>{const el=document.querySelector('[data-break-time]');if(!rest||!el)return;const remaining=rest.duration-rest.elapsed-(rest.running?(Date.now()-rest.startedAt)/1000:0);el.textContent=format(Math.max(0,remaining));if(remaining<=0&&rest.running){rest.elapsed=rest.duration;rest.running=false;redraw();announce('Break complete.');}},250);
  window.addEventListener('articul8:navigate',()=>{appQuery='';if(!location.hash.includes('meditation'))window.Wellness?.stop();if(!location.hash.startsWith('#room'))window.BodyRooms?.leave();});
  window.addEventListener('pagehide',()=>{audio.pause();trackLists.flat().filter(t=>t.url).forEach(t=>URL.revokeObjectURL(t.url));});
  window.ToolPages={render,heading,icon,button,redraw,format,mountWheels,mountChecklist,timerSession,startBreak,breakPage,pauseMusic};
})();

</script>
<script data-source="meditation.js">
(() => {
  const P=Product,S=Articul8,T=ToolPages,E=P.esc;
  const themes=[
    {title:'A little more space',anchor:'Notice the space around each breath. There is no need to fill it.',notice:'When a thought arrives, quietly name it thinking. Then let the next breath be a fresh beginning.'},
    {title:'Coming back to the body',anchor:'Feel the contact between your body and the chair or floor. Let that contact support you.',notice:'Travel gently from your feet to your shoulders. Notice sensation without needing to change it.'},
    {title:'One breath at a time',anchor:'Follow one comfortable breath from its beginning to its end.',notice:'If counting helps, count one on an exhale and two on the next. Begin again whenever you lose your place.'},
    {title:'A softer beginning',anchor:'Allow your jaw and your hands to soften, just a little.',notice:'Notice any effort you are holding. You can make room for it without needing to solve anything now.'},
    {title:'Listening quietly',anchor:'Notice a nearby sound, and then a sound further away. Let them come and go.',notice:'Rather than following a sound, notice the quiet between sounds. Your attention can rest there.'},
    {title:'Letting thoughts pass',anchor:'Picture thoughts as leaves moving slowly along water. You do not need to collect them.',notice:'Bring a gentle label to what is here: planning, remembering, or feeling. Then return to the contact of your feet.'},
    {title:'A moment of kindness',anchor:'Notice how you feel, without asking yourself to feel differently.',notice:'Offer yourself a simple phrase: I can take this one moment at a time. You do not need to believe it perfectly.'}
  ];
  const places=['the feeling of air at your nose','the rise and fall of your chest','the movement of your abdomen','the weight of your hands'];
  function daily(date=P.today()) {
    const day=Math.floor(Date.parse(date+'T12:00Z')/86400000),theme=themes[((day%themes.length)+themes.length)%themes.length],anchor=places[Math.floor(day/7)%places.length];
    return {id:'meditation-'+date,date,title:theme.title,seconds:600,ambience:'Soft ocean',cues:[
      [0,'Welcome. This is ten minutes for yourself. Find a comfortable position. You may close your eyes, or keep a soft gaze. Let your breathing stay natural. Nothing needs to be achieved.'],
      [45,'Feel where your body is supported. Notice your feet, your seat, and your hands. Let your shoulders settle. For these few moments, you can simply be here.'],
      [100,'Bring your attention to '+anchor+'. '+theme.anchor+' Stay with a few ordinary breaths.'],
      [160,'Your attention may have wandered. That is part of this practice. Notice where it went, without judging it. Gently return to '+anchor+'.'],
      [220,theme.notice+' Let the next few breaths arrive at their own pace.'],
      [280,'We are around the middle of this practice. Notice whether anything feels different, or whether it feels the same. Both are welcome. There is no special state to reach.'],
      [340,theme.anchor+' If this focus is not comfortable, choose the contact of your feet instead. You can adjust your position whenever you need to.'],
      [400,'For a little while, allow your attention to be wider. Include your breath, your body, and the sounds around you. Let experience move without having to hold onto it.'],
      [470,'Return to one simple point of contact. '+theme.notice+' Each return is a moment of practice.'],
      [540,'In our last minute, notice one thing that supported you. It might be a breath, a sound, or the decision to pause. Consider carrying a little of this gentleness into your next activity.'],
      [585,'Begin to notice the room again. Move your fingers or toes if you like. When you are ready, open your eyes. Thank you for making this time for yourself.']
    ].map(([at,text])=>({at,text}))};
  }
  let selected=daily(),elapsed=0,startedAt=0,running=false,volume=.8,previousVolume=.8;
  const seconds=()=>Math.max(0,Math.min(600,elapsed+(running?(Date.now()-startedAt)/1000:0)));

  const elapsedText=value=>T.format(Math.floor(value));

  function stop(){if(running)elapsed=seconds();running=false;}
  function start(){T.pauseMusic();if(seconds()>=600)elapsed=0;startedAt=Date.now();running=true;T.redraw();}
  function seek(value){const resume=running;stop();elapsed=Math.max(0,Math.min(600,Number(value)||0));if(resume&&elapsed<600)start();else T.redraw();}
  function setVolume(value){volume=Math.max(0,Math.min(1,Number(value)||0));if(volume>0)previousVolume=volume;document.querySelectorAll('[data-meditation-volume]').forEach(el=>el.value=Math.round(volume*100));const mute=document.querySelector('[data-meditation-mute]');if(mute){mute.innerHTML=T.icon(volume===0?'muted':'volume',22);mute.setAttribute('aria-label',volume===0?'Unmute meditation':'Mute meditation');mute.setAttribute('aria-pressed',String(volume===0));}}
  function choose(session){stop();selected=JSON.parse(JSON.stringify(session));elapsed=0;P.go('Toolbox','meditation');}
  const isSaved=()=>S.state.wellness.saved.some(x=>x.id===selected.id);
  const skipIcon=forward=>`<svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><g ${forward?'transform="translate(32 0) scale(-1 1)"':''}><path d="M8.22 8.22A11 11 0 1 1 5 16M8.22 3.22V8.22H13.22" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></g><text x="16" y="16" fill="currentColor" font-family="Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="central">15</text></svg>`;

<script data-source="insights.js">

  const lengths={day:1,week:7,quarter:90,semester:180,year:365};
  let range='week',offset=0;

    return '<div class="product-heading"><h1>Data</h1><button class="wire-button" type="button" data-export-data>Export my data</button></div>'+`<div class="data-filters" aria-label="Data period">${[['day','Day'],['week','Week'],['quarter','Quarter'],['semester','Semester'],['year','Year']].map(([id,label])=>`<button type="button" data-data-range="${id}" aria-pressed="${range===id}">${label}</button>`).join('')}</div><div class="data-period">${T.button('data-data-offset="1"','Previous period','back')}<h2>${start===end?start:start+' – '+end}${range==='quarter'?' · 90 days':range==='semester'?' · 180 days':''}</h2>${T.button('data-data-offset="-1"','Next period','arrow',offset===0?'disabled':'')}</div><div class="data-layout">${chart(buckets,'Focus time')}<div class="data-metrics"><div><strong>${duration(focused)}</strong><span>Focused</span></div><div><strong>${sessions.length}</strong><span>Focus sessions</span></div><div><strong>${days}</strong><span>Active focus days</span></div><div><strong>${steps}</strong><span>Subtasks completed</span></div><div><strong>${duration(appMs)}</strong><span>Time in app</span></div><div><strong>${visits}</strong><span>App visits</span></div></div></div><div class="data-insights"><section><h2>Your pattern</h2><p>${habit}</p>${sessions.length?`<p>${duration(average)} per focus session on average.</p>`:''}<p>${compare}</p></section><section><h2>Try next</h2><p>${suggestion}</p></section></div><section class="detail-section"><h2>History</h2>${data.slice().sort((a,b)=>b.finishedAt-a.finishedAt).slice(0,20).map(r=>`<div class="data-history-row"><div>${E(r.taskTitle)}<small>${dayOf(r.finishedAt)} · ${r.steps?.length||0} subtasks</small></div><span>${duration(r.focusMs)}</span></div>`).join('')||'<p class="detail-empty">No sessions in this period.</p>'}</section>`;
  }
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-data-range')){range=b.dataset.dataRange;offset=0;T.redraw();}if(b.hasAttribute('data-data-offset')){offset=Math.max(0,offset+Number(b.dataset.dataOffset));T.redraw();}if(b.hasAttribute('data-next-break'))T.startBreak();if(b.hasAttribute('data-next-continue')){const a=S.state.activeSession,record=S.state.sessions.find(r=>r.id===a?.id);if(b.dataset.nextContinue)FocusUI.start({taskId:b.dataset.nextContinue,minutes:Math.min(25,Math.max(5,Math.round((record?.focusMs||0)/60000)||10)),selected:['timer'],origin:a?.origin||'Toolbox'});else FocusUI.setup();}if(b.hasAttribute('data-next-chat')){const record=S.state.sessions.find(r=>r.id===S.state.activeSession?.id);if(record?.taskId)S.selectTask(record.taskId);setAgent(true);}});
  // Count only foreground, focused time; a suspended tab cannot add hours of idle time.
  let usageAt=Date.now(),tracking=document.visibilityState==='visible'&&document.hasFocus();
  function usage(){const now=Date.now(),delta=now-usageAt;usageAt=now;if(tracking&&delta>0&&delta<60000){const date=dayOf(now);S.change(s=>{const entry=s.usage.days[date]||={ms:0,visits:0};entry.ms+=delta;},'usage');}tracking=document.visibilityState==='visible'&&document.hasFocus();}
  S.change(s=>{const entry=s.usage.days[P.today()]||={ms:0,visits:0};entry.visits++;},'usage');
  document.addEventListener('visibilitychange',usage);window.addEventListener('focus',usage);window.addEventListener('blur',usage);window.addEventListener('pagehide',usage);setInterval(usage,15000);
  window.Insights={summary,profile};
})();

</script>
  <script data-source="pages.js">
(() => {
  const content=document.getElementById('page-content'),app=document.querySelector('.app'),home=document.querySelector('.workspace');
  const names=['Home','Courses','Toolbox','To Do List','Data','Calendar','Workflow','Profile','Focus','Room','Break'];
  const slug=name=>name==='To Do List'?'todos':name.toLowerCase();
  let currentPage='Home',path='';
  const renders={'To Do List':()=>ToolPages.render('checklist'),Data:()=>ProductPages.stats(),Calendar:()=>CalendarUI.render(),Toolbox:()=>ProductPages.toolbox(path),Workflow:()=>WorkflowUI.render(),Courses:()=>ProductPages.courses(),Profile:()=>ProductPages.profile(path),Focus:()=>FocusUI.render(),Room:()=>BodyRooms.render(path),Break:()=>ToolPages.breakPage()};
  function render(){
    if(currentPage==='Home'||currentPage==='Calendar')return;
    const top=content.scrollTop,viewport=content.querySelector('.canvas-viewport'),position=viewport?{left:viewport.scrollLeft,top:viewport.scrollTop}:null;
    const focused=document.activeElement;
    const identity=focused&&content.contains(focused)?['data-focus-step','data-tool-step','data-tool-select','data-course-task-check','data-favorite','data-helpful','data-list-check','data-list-title','data-meditation-progress','data-meditation-toggle','data-meditation-seek','data-meditation-mute'].find(a=>focused.hasAttribute(a)):null;
    const value=identity?focused.getAttribute(identity):null;
    content.innerHTML=renders[currentPage]();content.scrollTop=top;ToolPages.mountWheels();ToolPages.mountChecklist();BodyRooms.mount();
    if(position){const canvas=content.querySelector('.canvas-viewport');if(canvas){canvas.scrollLeft=position.left;canvas.scrollTop=position.top;}}
    if(identity)Array.from(content.querySelectorAll('['+identity+']')).find(e=>e.getAttribute(identity)===value)?.focus({preventScroll:true});
    if(currentPage==='Focus')FocusUI.paint();
  }
  function navigate(name,nextPath='',updateHash=true){
    if(name==='Toolbox'&&nextPath==='checklist'){name='To Do List';nextPath='';}
    if(name==='Profile'&&['data','stats'].includes(nextPath)){name='Data';nextPath='';}
    if(!names.includes(name))name='Home';
    if(name==='Toolbox'&&currentPage!=='Toolbox')Articul8.change(s=>{s.tools.selected=[];s.tools.customSelection=false;},'tool-selection-reset');
    CalendarUI.unmount();ProductPages.unmount();Product.closeModal();
    currentPage=name;path=nextPath;
    if(updateHash)history.pushState(null,'','#'+slug(name)+(path?'/'+encodeURIComponent(path):''));
    const isHome=name==='Home';app.classList.toggle('inner-page',!isHome);home.hidden=!isHome;document.getElementById('ai-toggle').hidden=isHome;content.hidden=isHome;content.setAttribute('aria-label',name);
    document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    if(!isHome){content.innerHTML=renders[name]();if(name==='Calendar')CalendarUI.mount(content);ToolPages.mountWheels();ToolPages.mountChecklist();BodyRooms.mount();}
    if(matchMedia('(max-width:760px)').matches)Articul8.change(s=>{s.collapsed=true;},'sidebar');
    content.scrollTop=0;setAgent(false);notice.hidden=true;document.title='Concentr8 · '+name;
    window.dispatchEvent(new CustomEvent('articul8:navigate',{detail:{page:name}}));FocusUI.paint();
  }
  function fromHash(){const parts=location.hash.slice(1).split('/');navigate(names.find(n=>slug(n)===parts[0])||'Home',decodeURIComponent(parts[1]||''),false);}
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
  window.addEventListener('articul8:go',e=>navigate(e.detail.page,e.detail.path||''));
  window.addEventListener('popstate',fromHash);
  window.addEventListener('articul8:rerender',render);
  window.addEventListener('articul8:change',e=>{
    const reason=e.detail.reason;
    if(['draft','sidebar','calendar-context','sound','workflow-name'].includes(reason))return;
    if(currentPage==='Toolbox'&&['tasks','message','task-context','context','tools','restore','calendar','wellness'].includes(reason))render();
    if(currentPage==='Workflow'&&['workflow','restore'].includes(reason))render();
    if(currentPage==='Courses'&&['tasks','courses','calendar','restore'].includes(reason))render();
    if(currentPage==='Focus'&&['tasks','focus','calendar','restore'].includes(reason))render();
    if(['Profile','Data'].includes(currentPage)&&['focus','restore'].includes(reason))render();
    if(currentPage==='To Do List'&&['tasks','calendar','restore'].includes(reason))render();
    if(currentPage==='Room'&&['focus','tasks','restore'].includes(reason))render();
  });
  fromHash();
})();

</script>
